name = "tata-edge-cloud-shadow"
main = "src/worker.mjs"
compatibility_date = "2026-09-25"
workers_dev = true
preview_urls = false

[vars]
WATCH_BASE_URL = "https://cesar-gerencial-watch-bridge.tata-academia.workers.dev"

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "SOURCE_DB"
database_name = "cesar-gerencial-mail-bridge"
database_id = "fc0ae418-599d-41da-b849-5fada0cc08e2"

[[services]]
binding = "WATCH_SERVICE"
service = "cesar-gerencial-watch-bridge"

[triggers]
crons = ["10 * * * *"]
