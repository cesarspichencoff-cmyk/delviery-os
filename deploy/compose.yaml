# DeliveryOS Cloud Pilot V1 — composição local
#
# NÃO EXECUTADO NESTA MÁQUINA: não há Docker aqui. Os arquivos estão completos,
# mas `docker compose config/build/up` ainda não passou neles. Ver o relatório.
#
#   cd deploy && cp .env.pilot.example .env   # e preencha
#   docker compose config
#   docker compose build
#   docker compose up -d
#
# Só o proxy publica porta. Todo o resto vive na rede privada.

name: deliveryos-pilot

services:
  # --------------------------------------------------------------- proxy
  # Único serviço com porta publicada. Termina TLS e fala HTTP com a API
  # dentro da rede privada.
  deliveryos-proxy:
    image: caddy:2-alpine
    container_name: deliveryos-proxy
    restart: unless-stopped
    depends_on:
      deliveryos-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Domínio configurável. Enquanto não houver domínio real, o Caddyfile
      # usa TLS interno e não pede certificado público.
      ENTREGAS_DOMAIN: ${ENTREGAS_DOMAIN:-localhost}
    networks: [interna]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # --------------------------------------------------------------- api
  # O servidor do Entregas. NÃO publica porta: quem alcança é o proxy.
  deliveryos-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: deliveryos-pilot:v1
    container_name: deliveryos-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      ENTREGAS_ENV: cloud
      ENTREGAS_BIND: 0.0.0.0
      ENTREGAS_UI_PORT: "5193"
      ENTREGAS_DATA_DIR: /dados
    volumes:
      # O volume é a única coisa que sobrevive à recriação do container.
      - entregas_dados:/dados
      # Configurações da unidade e do termo: fora do Git, somente leitura.
      - ./config:/config:ro
    networks: [interna]
    # `expose` documenta a porta interna sem publicá-la no host.
    expose:
      - "5193"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5193/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Tempo para o desligamento gracioso fechar o backup antes do SIGKILL.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: false # o processo grava no volume
    tmpfs:
      - /tmp:size=64m
    logging: *logs

  # --------------------------------------------------------------- backup
  # Backup acompanha a VERDADE escolhida pelo backend.
  #
  # file     -> tar do volume /dados;
  # postgres -> pg_dump custom do banco configurado.
  #
  # Falha fechada: backend desconhecido, URL ausente ou dump com erro derrubam
  # o sidecar; restart policy tenta novamente. Nunca transforma falha de backup
  # em sucesso silencioso.
  deliveryos-backup:
    image: postgres:16-bookworm
    container_name: deliveryos-backup
    restart: unless-stopped
    depends_on:
      deliveryos-api:
        condition: service_started
    environment:
      ENTREGAS_STORAGE_BACKEND: ${ENTREGAS_STORAGE_BACKEND:-file}
      DELIVERYOS_DATABASE_URL: ${DELIVERYOS_DATABASE_URL:-}
    volumes:
      - entregas_dados:/dados:ro
      - entregas_backups:/backups
    command: >
      sh -ceu '
        while true; do
          ts=$(date -u +%Y%m%dT%H%M%SZ);
          case "$ENTREGAS_STORAGE_BACKEND" in
            file)
              tar -czf "/backups/entregas-file-$ts.tar.gz" -C /dados .;
              ls -1t /backups/entregas-file-*.tar.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
              ;;
            postgres)
              test -n "$DELIVERYOS_DATABASE_URL" || {
                echo "backup postgres recusado: DELIVERYOS_DATABASE_URL ausente" >&2;
                exit 78;
              };
              pg_dump
                --dbname="$DELIVERYOS_DATABASE_URL"
                --format=custom
                --file="/backups/entregas-pg-$ts.dump";
              ls -1t /backups/entregas-pg-*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
              ;;
            *)
              echo "backup recusado: ENTREGAS_STORAGE_BACKEND inválido" >&2;
              exit 78
              ;;
          esac;
          sleep 86400;
        done
      '
    networks: [interna]
    logging: *logs

  # ------------------------------------------------------ restore postgres
  # NUNCA sobe no fluxo normal. Só profile maintenance + confirmação literal.
  # O alvo é uma URL SEPARADA da operacional e precisa nascer vazio; isto
  # transforma restore em ensaio verificável antes de qualquer promoção.
  deliveryos-postgres-restore:
    image: postgres:16-bookworm
    profiles: ["maintenance"]
    container_name: deliveryos-postgres-restore
    restart: "no"
    environment:
      DELIVERYOS_DATABASE_URL: ${DELIVERYOS_DATABASE_URL:-}
      ENTREGAS_RESTORE_DATABASE_URL: ${ENTREGAS_RESTORE_DATABASE_URL:-}
      ENTREGAS_RESTORE_SNAPSHOT: ${ENTREGAS_RESTORE_SNAPSHOT:-}
      ENTREGAS_RESTORE_CONFIRM: ${ENTREGAS_RESTORE_CONFIRM:-}
    volumes:
      - entregas_backups:/backups:ro
    command: >
      sh -ceu '
        test "$ENTREGAS_RESTORE_CONFIRM" = "YES" || {
          echo "restore recusado: ENTREGAS_RESTORE_CONFIRM precisa ser YES" >&2;
          exit 78;
        };
        test -n "$DELIVERYOS_DATABASE_URL" || {
          echo "restore recusado: URL operacional ausente" >&2;
          exit 78;
        };
        test -n "$ENTREGAS_RESTORE_DATABASE_URL" || {
          echo "restore recusado: URL alvo ausente" >&2;
          exit 78;
        };
        test "$ENTREGAS_RESTORE_DATABASE_URL" != "$DELIVERYOS_DATABASE_URL" || {
          echo "restore recusado: alvo não pode ser o banco operacional" >&2;
          exit 78;
        };
        case "$ENTREGAS_RESTORE_SNAPSHOT" in
          ""|*"/"*|*".."*)
            echo "restore recusado: snapshot inválido" >&2;
            exit 78
            ;;
        esac;
        test -f "/backups/$ENTREGAS_RESTORE_SNAPSHOT" || {
          echo "restore recusado: snapshot não encontrado" >&2;
          exit 78;
        };
        count=$(psql "$ENTREGAS_RESTORE_DATABASE_URL" -Atqc "
          SELECT count(*)
            FROM pg_class c
            JOIN pg_namespace n ON n.oid=c.relnamespace
           WHERE n.nspname NOT IN ('"'"'pg_catalog'"'"','"'"'information_schema'"'"')
             AND n.nspname NOT LIKE '"'"'pg_toast%'"'"'
        ");
        test "$count" = "0" || {
          echo "restore recusado: banco alvo não está vazio" >&2;
          exit 78;
        };
        pg_restore
          --dbname="$ENTREGAS_RESTORE_DATABASE_URL"
          --no-owner
          --no-privileges
          --exit-on-error
          "/backups/$ENTREGAS_RESTORE_SNAPSHOT"
      '
    networks: [interna]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    logging: *logs

# ---------------------------------------------------------------- rede
networks:
  interna:
    driver: bridge
    # `internal: false` porque a API precisa de saída para NTP/DNS; o que
    # importa é que nada aqui está publicado, exceto o proxy.

# ---------------------------------------------------------------- volumes
volumes:
  entregas_dados:
    name: deliveryos-pilot-dados
  entregas_backups:
    name: deliveryos-pilot-backups
  caddy_data:
    name: deliveryos-pilot-caddy-data
  caddy_config:
    name: deliveryos-pilot-caddy-config
