name: deliveryos-q026-event-loop-http-probe
# SHADOW diagnostic only. PostgreSQL16 ephemeral, localhost HTTP.
on:
  push:
    branches:
      - research/q026-event-loop-http-probe-20261010
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q026-loop-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fairness-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        events: [20000, 120000]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
      Q026_EVENT_LOOP_EVENTS: ${{ matrix.events }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck actual HTTP fairness fixture
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --strict --esModuleInterop --skipLibCheck --types node tests/product/run-q026-event-loop-http-fairness-shadow.ts
      - name: Measure two real Entregas reads while health remains responsive
        shell: bash
        run: |
          set -o pipefail
          npx tsx tests/product/run-q026-event-loop-http-fairness-shadow.ts | tee q026-loop.out
          grep '^Q026_EVENT_LOOP_HTTP_SHADOW_MEASURED ' q026-loop.out
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:platform:q016
      - run: npm run test:platform:product
      - run: npm run test:platform:governanca
      - name: Reject fixture pass without PostgreSQL
        shell: bash
        run: |
          set +e
          DELIVERYOS_PG_URL= npx tsx tests/product/run-q026-event-loop-http-fairness-shadow.ts
          test "$?" = 78
