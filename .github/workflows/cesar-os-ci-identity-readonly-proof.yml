name: CI Snapshot Exact Runtime Identity Probe

# Candidate branch only; no schedule or write permission.
on:
  push:
    branches:
      - cesar-os/work-ci-snapshot-candidate-20261010
    paths:
      - .github/workflows/cesar-os-ci-identity-readonly-proof.yml

permissions: {}

jobs:
  check:
    if: github.repository == 'cesarspichencoff-cmyk/delviery-os' && github.ref == 'refs/heads/cesar-os/work-ci-snapshot-candidate-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate repository environment identity only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "import {verifyContext} from './tools/cesar-os-ci/snapshot.mjs';const e={...process.env,GITHUB_REF:'refs/heads/main',GITHUB_EVENT_NAME:'workflow_dispatch'};const c=verifyContext(e);console.log(JSON.stringify({status:'IDENTITY_ENV_PROOF',repository:c.repository,sha:c.sha,repository_id:e.GITHUB_REPOSITORY_ID,owner_id:e.GITHUB_REPOSITORY_OWNER_ID,token_present:!!e.GITHUB_TOKEN}));"
