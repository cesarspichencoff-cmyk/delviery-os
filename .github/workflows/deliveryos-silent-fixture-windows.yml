name: Delivery OS silent fixture (isolated)
on:
  pull_request:
    types: [synchronize, reopened]
    branches:
      - integration/deliveryos-v1-connected-20261102
    paths:
      - .github/workflows/deliveryos-silent-fixture-windows.yml
      - runtime/silent-runner/**
      - tests/silent-runner/**
      - runtime/reporting/diagnostic_readiness_v1.cjs
      - tests/reporting/run-diagnostic-readiness-tests.cjs
      - runtime/reporting/copiloto_tata_reader_adapter_v1.cjs
      - runtime/reporting/copiloto_tata_file_feed_v1.cjs
      - runtime/reporting/native_reader_verified_legacy_hash_v1.cjs
      - runtime/reporting/native_reader_producer_contract_review_v1.cjs
      - tests/tata-reader/run-copilot-reader-adapter-tests.cjs
      - tests/tata-reader/run-real-feed-boundary-tests.cjs
      - tests/tata-reader/run-file-feed-tests.cjs
      - tests/reporting/run-native-reader-producer-contract-review-tests.cjs
      - src/product/eventos/vinculo-reader-trabalho-praca.ts
      - src/platform/run-reader-station-link-review-tests.ts
      - src/product/eventos/revisar-classificacao-trabalho-praca.ts
      - src/platform/run-reader-classification-work-review-tests.ts
      - src/product/eventos/gesto-bancada-shadow.ts
      - src/platform/run-gesto-bancada-shadow-tests.ts
      - src/entregas/ui/rider-mobile/rider.js
      - src/entregas/ui/rider-mobile/rider-trip-scope.js
      - src/entregas/ui/rider-mobile/run-queue-health-tests.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deliveryos-silent-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Static fixture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node contract tests (synthetic only)
        run: |
          node tests/silent-runner/run-contract-tests.cjs
          node tests/silent-runner/run-pair-contract-tests.cjs
          node tests/reporting/run-diagnostic-readiness-tests.cjs
          # Read-only Reader-to-Copiloto contract; synthetic only, no Windows service.
          node tests/reporting/run-native-reader-producer-contract-review-tests.cjs
          node tests/tata-reader/run-copilot-reader-adapter-tests.cjs
          node tests/tata-reader/run-real-feed-boundary-tests.cjs
          node tests/tata-reader/run-file-feed-tests.cjs
          # Rider actor identity + Room queue HOLD; synthetic only, no devices.
          node src/entregas/ui/rider-mobile/run-queue-health-tests.mjs

  native-windows:
    name: Windows no-console native fixture
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and verify in isolated Windows runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & ./tests/silent-runner/verify-windows-fixture.ps1
          node tests/reporting/run-diagnostic-readiness-tests.cjs

  native-station-link-review:
    name: Exact Reader line to R5D3 work (synthetic only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Compile existing TypeScript contracts
        run: npm run build
      - name: Reader line to work events, no live/readiness authority
        run: node dist/src/platform/run-reader-station-link-review-tests.js
      - name: Reader classification to exact station consistency (review only)
        run: node dist/src/platform/run-reader-classification-work-review-tests.js
      - name: One-touch station action only in shadow; permission + source gates
        run: node dist/src/platform/run-gesto-bancada-shadow-tests.js
