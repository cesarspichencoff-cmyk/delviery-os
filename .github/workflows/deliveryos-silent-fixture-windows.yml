name: Delivery OS silent fixture (isolated)
on:
  pull_request:
    types: [synchronize, reopened]
    branches:
      - integration/deliveryos-v1-connected-20261102
    paths:
      - .github/workflows/deliveryos-silent-fixture-windows.yml
      - runtime/silent-runner/**
      - tests/silent-runner/**
      - runtime/reporting/diagnostic_readiness_v1.cjs
      - tests/reporting/run-diagnostic-readiness-tests.cjs
      - runtime/reporting/copiloto_tata_reader_adapter_v1.cjs
      - runtime/reporting/copiloto_tata_file_feed_v1.cjs
      - runtime/reporting/native_reader_verified_legacy_hash_v1.cjs
      - runtime/reporting/native_reader_producer_contract_review_v1.cjs
      - runtime/reporting/native_reader_shadow_replay_v1.cjs
      - tests/reporting/run-native-reader-shadow-replay-tests.cjs
      - tests/reporting/run-pr135-native-child-observation-l1-contract.cjs
      - runtime/reporting/native_reader_n2n3_sanitized_receipt_v1.cjs
      - runtime/reporting/native_reader_existing_event_binding_v1.cjs
      - tests/reporting/run-native-reader-existing-event-binding-tests.cjs
      - tests/reporting/build-reader-one-shot-lab-fixture.cjs
      - runtime/reporting/native_reader_n2_base_tables_review_v1.cjs
      - tests/reporting/run-native-reader-n2-base-tables-review-tests.cjs
      - tests/reporting/run-reader-sql-dmv-baseline-static-tests.cjs
      - tests/reporting/run-android-event-batch-4xx-source-contract-tests.cjs
      - android/app/src/main/java/br/com/tata/entregas/sync/EventBatchHttpRejection.kt
      - android/app/src/main/java/br/com/tata/entregas/sync/EventBatchHttpRejectionRoom.kt
      - android/app/src/main/java/br/com/tata/entregas/sync/SyncWorker.kt
      - android/app/src/test/java/br/com/tata/entregas/EventBatchHttpRejectionTest.kt
      - android/app/src/test/java/br/com/tata/entregas/EventBatchHttpRejectionRoomTest.kt
      - tests/reporting/run-native-reader-n2n3-sanitized-receipt-tests.cjs
      - labs/reader-proof/**
      - tests/reporting/run-reader-one-shot-lab-tests.cjs
      - tests/reporting/run-reader-one-shot-dependency-pin-tests.cjs
      - labs/reader-proof/NativeReaderOneShotLabLauncher.cs
      - tests/reporting/build-reader-one-shot-lab-fixture.cjs
      - runtime/tata-reader/tata_reader_health_v1.cjs
      - tests/tata-reader/run-health-consumer-v2-gate-tests.cjs
