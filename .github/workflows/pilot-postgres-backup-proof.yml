name: pilot-postgres-backup-proof

on:
  push:
    branches:
      - tmp/pilot-postgres-backup-restore-20261001

permissions:
  contents: read

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version
          pg_restore --version
      - run: npm ci
      - run: npm run build
      - run: npm run test:entregas:pilot-postgres-backup
      - run: npm run test:platform:backup
      - run: npm run test:entregas:storage-cutover
      - run: npm run test:entregas:pilot-postgres-cluster
      - run: npm run test:entregas:deploy-audit
      - name: Docker Compose render + runtime expansion
        run: |
          cp deploy/.env.pilot.example deploy/.env
          docker compose --profile maintenance -f deploy/compose.yaml config --format json > /tmp/deliveryos-pilot-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path("/tmp/deliveryos-pilot-compose.json").read_text())
          services = cfg["services"]
          backup = services["deliveryos-backup"]
          restore = services["deliveryos-postgres-restore"]

          backup_cmd = " ".join(backup["command"]) if isinstance(backup["command"], list) else str(backup["command"])
          restore_cmd = " ".join(restore["command"]) if isinstance(restore["command"], list) else str(restore["command"])
          d = "$"
          dd = d + d

          # O modelo renderizado preserva o escape de Compose.
          assert f'case "{dd}ENTREGAS_STORAGE_BACKEND" in' in backup_cmd, backup_cmd
          assert "pg_dump" in backup_cmd, backup_cmd
          assert f'{dd}DELIVERYOS_DATABASE_URL' in backup_cmd, backup_cmd
          assert f'{dd}ENTREGAS_RESTORE_CONFIRM' in restore_cmd, restore_cmd
          assert f'{dd}ENTREGAS_RESTORE_DATABASE_URL' in restore_cmd, restore_cmd
          assert "pg_restore" in restore_cmd, restore_cmd

          assert backup["environment"]["ENTREGAS_STORAGE_BACKEND"] == "file"
          assert restore["profiles"] == ["maintenance"]
          assert "ports" not in restore
          print("COMPOSE_RENDER_MODEL_GREEN")
          PY

          # Fronteira real do container: file deve fazer tar e entrar no sleep.
          # Se o escape chegar errado ao shell, o case cai no inválido e sai 78.
          set +e
          timeout 8s docker compose -f deploy/compose.yaml run --no-deps --rm \
            -e ENTREGAS_STORAGE_BACKEND=file \
            deliveryos-backup > /tmp/backup-runtime-probe.log 2>&1
          rc=$?
          set -e
          cat /tmp/backup-runtime-probe.log
          test "$rc" -eq 124
          ! grep -F "backup recusado" /tmp/backup-runtime-probe.log
          echo "COMPOSE_RUNTIME_EXPANSION_GREEN"
          docker compose --profile maintenance -f deploy/compose.yaml down --remove-orphans -v || true
      - run: npm run test:platform:governanca
      - run: git diff --check
