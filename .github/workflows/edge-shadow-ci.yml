name: Edge Shadow CI

on:
  push:
    branches:
      - design/tata-edge-runtime-foundation-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security inventory
        shell: bash
        run: |
          echo "::group::xlsx source references"
          git grep -nEi '(^|[^A-Za-z0-9_])(xlsx|XLSX|sheetjs)([^A-Za-z0-9_]|$)' -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' || true
          echo "::endgroup::"
          echo "::group::npm audit"
          npm audit --json || true
          echo "::endgroup::"

      - name: Edge dependency boundary
        shell: bash
        run: |
          if git grep -nEi '(^|[^A-Za-z0-9_])(xlsx|XLSX|sheetjs)([^A-Za-z0-9_]|$)' -- 'src/edge/**' 'demo/edge_*.ts'; then
            echo "Forbidden legacy spreadsheet dependency referenced by Edge"
            exit 1
          fi
          npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Edge synthetic suite
        run: npm run test:edge:shadow:all
