name: Edge Shadow CI

on:
  push:
    branches:
      - design/tata-edge-runtime-foundation-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Edge synthetic suite
        run: npm run test:edge:shadow:all