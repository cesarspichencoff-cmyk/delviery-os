name: q026-batch-size-evidence
# DRAFT/HOLD: isolated PG16, no operational credentials, no deployments.
on:
  push:
    branches:
      - research/q026-batch-257-vs-1024-vs-4096-20261010
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q026-batch-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  batch-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: 120k_long, long: 120000, short: 0}
          - {case: 300k_long, long: 300000, short: 0}
          - {case: 30k_short_trips, long: 0, short: 30000}
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
      Q026_MEDIDA_LONGA: ${{ matrix.long }}
      Q026_MEDIDA_CURTAS: ${{ matrix.short }}
      Q026_MEDIDA_REPETICOES: "3"
      Q026_MEDIDA_LOTES: "257,1024,4096"
      Q026_MEDIDA_SAIDA: q026-batch-${{ matrix.case }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck product and measurement sources
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --strict --esModuleInterop --skipLibCheck --types node tests/product/run-q026-leitor-incremental-medicao.ts tests/product/q026-leitor-incremental-medida-filho.ts
      - name: Five-mode child-process calibrated A/B using single synthetic PG fixture
        shell: bash
        run: |
          set -o pipefail
          npx tsx tests/product/run-q026-leitor-incremental-medicao.ts | tee q026-batch.log
          grep '^Q026_LEITOR_INCREMENTAL_MEDICAO ' q026-batch.log
          node -e 'const d=require("./"+process.env.Q026_MEDIDA_SAIDA);if(d.tabela.length!==5||d.repeticoes!==3||d.calibracao.atraso_max_do_laco_ms<200||!d.digest)process.exit(9);for(const a of d.tabela)if(a.n!==3)process.exit(10);console.log("Q026_BATCH_EVIDENCE_VALIDATED",d.linhas,d.viagens,d.digest)'
      - uses: actions/upload-artifact@v4
        with:
          name: q026-batch-${{ matrix.case }}
          path: q026-batch-${{ matrix.case }}.json
          if-no-files-found: error
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:platform:q016
      - run: npm run test:platform:product
      - run: npm run test:platform:governanca
      - name: No database must fail explicitly
        shell: bash
        run: |
          set +e
          DELIVERYOS_PG_URL= Q026_MEDIDA_LONGA=120000 Q026_MEDIDA_LOTES=257,1024,4096 npx tsx tests/product/run-q026-leitor-incremental-medicao.ts
          code=$?
          echo "no_db_exit=$code"
          test "$code" = 78
