name: DeliveryOS G1 turno v2 — laboratorio isolado
on:
  push:
    branches:
      - test/deliveryos-g1-service-state-v2-lab-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-state-v2-contract-lab:
    name: Turno v2 sintético (PowerShell Windows)
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validar contrato, limites e journal sem fonte real
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\tata-reader\lab\run-service-state-v2-lab-tests.ps1
      - name: Provar contrato contra funcao Read-ServiceState do watcher v2 instalado
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\tata-reader\lab\run-installed-watcher-v2-contract-tests.ps1
      - name: Confirmar que a suite nao acessa o estado da loja
        shell: powershell
        run: |
          $a = Get-Content .\tests\tata-reader\lab\write-service-state-v2-fixture.ps1 -Raw
          if ($a -notmatch 'LAB_ROOT_MUST_BE_DIRECT_TEMP_CHILD' -or
              $a -notmatch 'LAB_SYNTHETIC_SOURCE_REQUIRED') {
            throw 'LAB_ISOLATION_GUARD_MISSING'
          }
          Write-Output 'G1_LAB_NO_PRODUCTION_STATE=PASS'
