name: DeliveryOS Android event receipt
on:
  push:
    branches:
      - feat/deliveryos-android-event-receipt-20261009
      - feat/deliveryos-android-event-receipt-fixed-20261009
      - integration/deliveryos-product-ux-android-20261009
      - integration/deliveryos-q025-review-20261009
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deliveryos-android-event-receipt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: JVM Android + Room regression
        working-directory: android
        run: bash ./gradlew --no-daemon --console=plain testDebugUnitTest
      - name: JUnit proof
        if: always()
        working-directory: android
        run: |
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          files=glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          tests=failures=errors=0
          for f in files:
            t=ET.parse(f).getroot()
            tests+=int(t.attrib.get("tests","0"))
            failures+=int(t.attrib.get("failures","0"))
            errors+=int(t.attrib.get("errors","0"))
          print(f"ANDROID_EVENT_RECEIPT_JUNIT: suites={len(files)}, tests={tests}, failures={failures}, errors={errors}")
          PY
