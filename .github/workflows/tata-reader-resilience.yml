# Regressao do leitor TATA Comanda e dos gates de plataforma tocados por esta
# frente. Roda na branch de resiliencia ou no fix isolado V2 (e manual).
#
#  - node-postgres: avaliador de saude, auditoria estatica, migrations
#    reexecutaveis, preflight, B5 em PostgreSQL real, Product System e /api/fontes.
#  - pwsh-sqlserver: supervisor (processo real), cutover (logica pura) e o
#    harness contra SQL Server 2022 real (dados sinteticos), com controle
#    negativo: o defeito de 05/10 PRECISA reproduzir para a correcao valer.
#  - windows-real-scm: o que so o Windows mostra. Suites do supervisor e do
#    cutover sob o Windows PowerShell 5.1 (.NET Framework) no fuso da CAIXA, e
#    o cutover inteiro contra o SCM REAL, com o host C# v2 real compilado pelo
#    csc.exe do .NET Framework e a conta virtual NT SERVICE\TataComandaReader.
#    Runner padrao em repositorio publico: sem custo.
#
# Nenhum segredo real: o SQL Server e um container descartavel do proprio job.
name: TATA reader resilience
on:
  workflow_dispatch:
  push:
    branches: [feat/cloud-solo-reader-resilience-20261007, fix/tata-reader-health-consumer-v2-20261009]
permissions:
  contents: read
concurrency:
  group: tata-reader-resilience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run -s build:platform
      - run: npm run -s test:tata-reader:health
      - run: npm run -s test:tata-reader:static
      - run: npm run -s test:platform:migration-reexec
      - run: npm run -s test:platform:pg
      - run: npm run -s test:platform:database-preflight
      - run: npm run -s test:platform:queue-depth:pg
      - run: npm run -s test:platform:queue-depth:http:pg
      - run: npm run -s test:platform:product
      - run: npm run -s test:platform:saude-fontes
      - run: npm run -s test:platform:papeis:compose
      - run: npm run -s test:platform
  pwsh-sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci!Harness-${{ github.run_id }}x
        ports: ["1433:1433"]
    env:
      TATA_HARNESS_SQLSERVER: 127.0.0.1,1433
      TATA_HARNESS_SA_PASSWORD: Ci!Harness-${{ github.run_id }}x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: PowerShell presente
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Espera o SQL Server aceitar conexao
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(3)
          while ($true) {
            try {
              $c = New-Object System.Data.SqlClient.SqlConnection("Server=$env:TATA_HARNESS_SQLSERVER;Database=master;User ID=sa;Password=$env:TATA_HARNESS_SA_PASSWORD;Encrypt=False;TrustServerCertificate=True;Connect Timeout=5")
              $c.Open(); $c.Dispose(); "SQLSERVER_READY"; break
            } catch {
              if ((Get-Date) -gt $deadline) { throw }
              Start-Sleep -Seconds 3
            }
          }
      - name: Compatibilidade Windows PowerShell 5.1 (PSScriptAnalyzer, com controle positivo)
        shell: pwsh
        run: |
          Save-Module -Name PSScriptAnalyzer -RequiredVersion 1.23.0 -Path "$env:RUNNER_TEMP/psm" -Repository PSGallery -Force
          ./tests/tata-reader/ps51_compat_check.ps1 -ModulePath "$env:RUNNER_TEMP/psm/PSScriptAnalyzer/1.23.0/PSScriptAnalyzer.psd1"
      - run: TATA_PWSH=$(which pwsh) node tests/tata-reader/run-supervisor-tests.cjs
      - run: TATA_PWSH=$(which pwsh) node tests/tata-reader/run-cutover-logic-tests.cjs
      - run: TATA_PWSH=$(which pwsh) node tests/tata-reader/run-cutover-e2e-tests.cjs
      - run: TATA_PWSH=$(which pwsh) node tests/tata-reader/run-sqlserver-harness.cjs
  windows-real-scm:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      TATA_PWSH: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fuso da CAIXA (America/Sao_Paulo) e Windows PowerShell 5.1
        shell: powershell
        run: |
          tzutil /s "E. South America Standard Time"
          [TimeZoneInfo]::ClearCachedData()
          "fuso=" + [TimeZoneInfo]::Local.Id
          "ps=" + $PSVersionTable.PSVersion + " clr=" + $PSVersionTable.CLRVersion
          "netfx_release=" + (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full").Release
          "PSModulePath (este passo, powershell direto do runner)=" + $env:PSModulePath
      - name: Bytes exatos no checkout do Windows (sem CRLF)
        shell: powershell
        run: |
          $h = (Get-FileHash tests\tata-reader\fixtures\watcher_v1_installed_256dc42.ps1 -Algorithm SHA256).Hash
          $c = (Get-FileHash tests\tata-reader\fixtures\host_v2\TataComandaReader.ContinuousService.v2.cs -Algorithm SHA256).Hash
          "watcher=$h host_src=$c"
          if ($h -ne "4507304C7A8AA7B19EC303A5692094CB738A561DFDE769ABD234D900447CAA9A") { throw "watcher instalado com bytes trocados" }
          if ($c -ne "9345E2FBE5B19F09D14F714163225633401BA966B578F86ECD848EBA726BA0F7") { throw "fonte do host com bytes trocados" }
      - run: node tests/tata-reader/run-health-tests.cjs
      - run: node tests/tata-reader/run-static-audit-tests.cjs
      - name: Supervisor sob Windows PowerShell 5.1
        run: node tests/tata-reader/run-supervisor-tests.cjs
      - name: Cutover (decisao e contrato) sob Windows PowerShell 5.1
        run: node tests/tata-reader/run-cutover-logic-tests.cjs
      - name: Cutover inteiro contra o SCM REAL (host C# v2 real, conta virtual)
        shell: powershell
        run: .\tests\tata-reader\windows\real_scm_cutover_e2e.ps1 -RepoRoot $PWD.Path -OutDir "$env:RUNNER_TEMP\real-scm"
      - name: Recibos e retratos da prova real
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tata-reader-real-scm-e2e
          path: ${{ runner.temp }}/real-scm
          if-no-files-found: warn
          retention-days: 14
  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Testes JVM do app Android (sem aparelho, sem emulador)
        working-directory: android
        run: bash ./gradlew --no-daemon --console=plain testDebugUnitTest
      - name: Resumo JUnit
        if: always()
        working-directory: android
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tot = fal = 0
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              r = ET.parse(f).getroot()
              tot += int(r.get("tests")); fal += int(r.get("failures")) + int(r.get("errors"))
              print(r.get("name").split(".")[-1], r.get("tests"), r.get("failures"), r.get("errors"))
          print(f"ANDROID_UNIT tests={tot} falhas={fal}")
          raise SystemExit(1 if tot == 0 or fal else 0)
          PY
