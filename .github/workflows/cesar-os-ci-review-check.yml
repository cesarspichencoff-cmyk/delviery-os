name: CÉSAR OS CI Replay Review Check

# PR-only verification. No schedule, deployment, secrets, or write permissions.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/cesar-os-ci/**'
      - 'test/cesar-os-ci-*.test.mjs'
      - '.github/workflows/cesar-os-ci-review-check.yml'

permissions:
  contents: read

concurrency:
  group: cesar-os-ci-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'cesarspichencoff-cmyk/delviery-os' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR merge ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify Node availability
        run: node --version
      - name: Test public CI snapshot, archive, replay and cursor guards
        run: node --test test/cesar-os-ci-snapshot.test.mjs
      - name: Inspect actual GitHub archive API without writing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/cesar-os-ci/replay-live-smoke.mjs
