name: Shadow consumer regression

on:
  push:
    branches:
      - 'tmp/paired-comanda-nfce-20261007'
    paths:
      - '.github/workflows/shadow-consumer-regression.yml'
      - 'runtime/shadow/live_shadow_consumer_v1.cjs'
      - 'runtime/shadow/candidates/**'
      - 'tests/shadow-*.test.cjs'
  pull_request:
    paths:
      - '.github/workflows/shadow-consumer-regression.yml'
      - 'runtime/shadow/live_shadow_consumer_v1.cjs'
      - 'runtime/shadow/candidates/**'
      - 'tests/shadow-*.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-consumer-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-shadow-only:
    name: Syntax and exact-identity gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Node runtime
        run: node --version

      - name: Syntax-check both source and reconciled candidate
        run: |
          node --check runtime/shadow/live_shadow_consumer_v1.cjs
          node --check runtime/shadow/candidates/CAIXA_MOOCA_consumer_bar_exact_20261007.cjs

      - name: Verify exact Bar reference mapping
        run: node tests/shadow-retail-bar-exact.test.cjs

      - name: Verify live-derived candidate and its safety guards
        run: node tests/shadow-bar-reconciled-candidate.test.cjs

      - name: Run synthetic full-consumer safety contract
        run: node tests/shadow-synthetic-contract.test.cjs

      - name: Checkout pinned TATA Academia source (public, read-only)
        uses: actions/checkout@v4
        with:
          repository: cesarspichencoff-cmyk/tata-academia
          ref: 6396427220b5eb2e2d1a570ef58437a4d302ff49
          path: .ci/academy
          persist-credentials: false

      - name: Validate full consumer with real Academy packaging engine
        run: ACADEMIA_ROOT="$GITHUB_WORKSPACE/.ci/academy" node tests/shadow-academy-engine-contract.test.cjs

      - name: Assert no deployment side effects
        run: |
          echo "CI only: never install on CAIXA_MOOCA; no print, fiscal, or cutover."
