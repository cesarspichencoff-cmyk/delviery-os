name: deliveryos-product-ux

# Product System / Entregas — "a rua, lida agora" (missao de 2026-10-09).
# So roda na branch desta frente. Nao toca a frente Android, nao publica nada,
# nao usa segredo: PostgreSQL 16 efemero do proprio runner, socket Unix privado
# e Chromium do proprio Playwright. Repositorio publico: runner padrao.
#
# O que NAO prova: aparelho fisico, CAIXA, producao. A falha pre-existente do
# C6 (Q-019) e classificada por igualdade em run-sem-fail-novo.ts — nunca
# ignorada, nunca pintada de verde.

on:
  push:
    branches: [feat/claude-product-ux-autonomous-20261009, integration/deliveryos-product-ux-android-20261009, feat/deliveryos-itaim-db-error-boundary-20261009, integration/deliveryos-q025-review-20261009, integration/copiloto-entregas-readonly-20261012, candidate/copiloto-entregas-unified-shadow-20261012, test/deliveryos-copiloto-browser-sharedpg-20261015, test/deliveryos-scoped-api-lab-20261015, test/deliveryos-operator-session-rls-lab-20261015, test/deliveryos-feed-consumer-e2e-lab-20261020, candidate/deliveryos-opus55-runtime-20261020, candidate/deliveryos-v1-home-provenance-combined-20261020, review/deliveryos-v1-role-convergence-20261022]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # as guardas de congelamento leem a historia inteira
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Alternativa comprovada ao pull publico ECR com quota esgotada.
      # Postgres 16 ja integra a imagem Ubuntu 24.04 do runner; nao usa sudo
      # nem toca em serviço global. Cluster/sock proprio; TCP desativado.
      - name: PostgreSQL 16 efemero sem Docker pull
        shell: bash
        run: |
          set -euo pipefail
          pg_bin=/usr/lib/postgresql/16/bin
          test -x "$pg_bin/initdb"
          pg_data="$RUNNER_TEMP/deliveryos-pg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pg_sock="$RUNNER_TEMP/deliveryos-sock-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$pg_sock"
          "$pg_bin/initdb" -D "$pg_data" --username="$USER" --auth-local=trust --auth-host=trust --no-instructions > "$RUNNER_TEMP/pg-init.log" 2>&1
          "$pg_bin/pg_ctl" -D "$pg_data" -o "-c listen_addresses='' -c unix_socket_directories='$pg_sock' -c port=55434" -l "$RUNNER_TEMP/pg-server.log" -w start
          "$pg_bin/pg_isready" -h "$pg_sock" -p 55434 -U "$USER" -d postgres
          echo "DELIVERYOS_PG_URL=postgresql://$USER@localhost:55434/postgres?host=$pg_sock" >> "$GITHUB_ENV"
          echo "DELIVERYOS_PG_DATA=$pg_data" >> "$GITHUB_ENV"
      - name: SQL 0001-0010 reais + papeis oficiais no PG efemero
        run: node tests/product/run-official-migrations-role-composition-lab.cjs
      - name: Papel de recibos em PG efemero (somente fixture, sem migration 0011)
        run: node tests/product/run-inbound-receipt-role-attestation-lab.cjs
      - name: Proposta RLS por unidade (PG efemero, sem migration 0011)
        run: node tests/product/run-review-receipt-rls-composition-lab.cjs
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      # A API de aparelho e executada contra dist/tools/entregas_pilot_server.js:
      # compilar ANTES do teste, sem duplicar o build no workflow.
      - run: npm run -s build:platform
      - name: Recibos duraveis - regressao sintetica do nucleo original
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for test_path in \
            src/entregas/persistence/run-inbound-fingerprint-normalization-tests.ts \
            src/entregas/operational/run-inbound-replay-tests.ts \
            src/entregas/operational/run-inbound-command-id-collision-tests.ts \
            src/entregas/operational/run-inbound-commit-uncertainty-tests.ts \
            src/entregas/operational/run-inbound-stage-isolation-tests.ts \
            src/entregas/operational/run-rejected-receipt-lifecycle-tests.ts \
            src/entregas/operational/run-shared-uow-cross-instance-tests.ts \
            src/entregas/persistence/run-inbound-receipt-tests.ts \
            src/entregas/pilot/run-cutover-inbound-receipts-tests.ts
          do
            echo "=== $test_path ==="
            npx tsx "$test_path" || failed=$((failed+1))
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::$failed testes de recibos falharam"
            exit 1
          fi
      # Os gates sao processos independentes: um RED HTTP nao pode pular
      # a regressao de offline, fonte e piloto. Um gate final FORCA falha.
      - name: Android - contrato estrutural sintetico (sem aparelho)
        run: npx tsx src/entregas/android/run-android-project-tests.ts
      - name: HTTP do aparelho - idempotencia e replay (P0)
        id: http_device_gate
        continue-on-error: true
        run: npx tsx src/entregas/android/run-device-api-tests.ts
      - name: Offline e piloto - regressao independente (sem aparelho)
        shell: bash
        run: |
          set -euo pipefail
          npx tsx src/entregas/offline/run-offline-tests.ts
          npx tsx src/entregas/offline/run-outbox-persistence-tests.ts
          npx tsx src/entregas/pilot/run-source-mode-tests.ts
          npx tsx src/entregas/pilot/run-pilot-gate-tests.ts
      - name: produtor ficticio assinado -> consumidor real (LAB em memoria)
        run: npx tsx tests/product/run-attested-feed-consumer-memory-lab-tests.ts
      - name: fronteira de procedencia do produtor (modulos de producao, portas em memoria)
        run: npx tsx src/platform/run-producer-attestation-tests.ts
      - name: fronteira de procedencia — mutacoes (zero cegas)
        run: npx tsx src/platform/run-producer-attestation-mutation-tests.ts
      - name: piloto real (dist/) assina a outbox ou recusa subir
        run: npx tsx src/entregas/pilot/run-producer-signing-boot-tests.ts
      - name: real declarado e isolado pelo consumer (LAB de fronteira)
        run: npx tsx tests/product/run-entregas-source-provenance-boundary-lab-tests.ts
      - name: Copiloto le a mesma projecao de Entregas (sem comando ou PII)
        run: npx tsx src/product/viewmodels/run-copiloto-entregas-leitura-tests.ts
      - name: Seis celulas V3.3 sem pressão artificial e sem motoboy duplicado
        run: npx tsx src/product/viewmodels/run-copiloto-celulas-v33-tests.ts
      - name: Instalar Chromium somente antes das provas de navegador
        run: npx playwright install --with-deps chromium
      - name: Copiloto e Entregas no mesmo HTTP real + Chromium 390
        run: npx tsx tests/product/run-copiloto-entregas-http-browser.ts
      - name: leitura da rua (view model + superficie)
        run: npx tsx tests/product/run-entregas-leitura-da-rua-tests.ts
      - name: navegador (dobra, teclado, idade da leitura, contraste, movimento reduzido)
        run: npx tsx tests/product/run-entregas-browser-tests.ts --evidencias "$RUNNER_TEMP/evidencias/navegador"
      - name: servidor + PostgreSQL real (filtro de unidade, somente leitura)
        run: npx tsx tests/product/run-entregas-servidor-pg-tests.ts --evidencias "$RUNNER_TEMP/evidencias/postgresql"
      - name: piloto outbox -> plataforma -> Copiloto no mesmo PostgreSQL (LAB sintético)
        run: npx tsx tests/product/run-pilot-copiloto-outbox-e2e-lab-tests.ts
      - name: produtor assinado -> fronteira sob papel minimo -> plataforma -> Copiloto (LAB PG efemero)
        run: npx tsx tests/product/run-producer-attestation-pg-copiloto-lab-tests.ts
      - name: falha do PostgreSQL nao revela IP, porta ou segredo no painel
        run: npx tsx tests/product/run-entregas-db-error-boundary-tests.ts
      # axe-core NAO e dependencia do repositorio (package.json intocado): versao
      # fixa, baixada para fora da arvore e conferida por sha256 antes de rodar.
      - name: acessibilidade automatica (axe-core, todas as rotas, 390 e 1440)
        run: |
          mkdir -p "$RUNNER_TEMP/axe" && cd "$RUNNER_TEMP/axe"
          npm pack axe-core@4.10.2 --silent
          echo "9ea2d2d6917da998122bdacfd3b473e31ead53f4b87146c716a12edf89158100  axe-core-4.10.2.tgz" | sha256sum -c -
          tar -xzf axe-core-4.10.2.tgz
          cd "$GITHUB_WORKSPACE"
          PRODUCT_UI_AXE="$RUNNER_TEMP/axe/package/axe.min.js" npx tsx tests/product/run-a11y-axe-tests.ts
      - run: npm run -s test:platform:product
      - name: Home M1B - 24 cenas no Chromium da mesma revisao (somente demo)
        shell: bash
        run: |
          set -euo pipefail
          unset DELIVERYOS_PG_URL DELIVERYOS_DATABASE_URL CONFERENCE_BRAIN_DATA_DIR TATA_READER_INSTALL_ROOT DELIVERYOS_PRODUCT_READ_UNIT
          export PRODUCT_UI_PORT=5369
          npx tsx tools/product_system_server.ts > "$RUNNER_TEMP/m1b-localhost.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:5369/api/health >/dev/null; then break; fi
            sleep 0.5
          done
          M1B_URL=http://127.0.0.1:5369 npx tsx tests/product/run-m1b-home-visual-truth-tests.ts
          # Q-020: mesmas APIs GET de historico e fonte, SEM reader, PG ou operacao.
          Q020_PREVIEW_URL=http://127.0.0.1:5369 npx tsx tests/product/run-q020-preview-readonly-tests.ts
          mkdir -p "$RUNNER_TEMP/evidencias/m1b"
          cp -r "$(node -p 'require("os").tmpdir()')/deliveryos-m1b-home-20261020/." "$RUNNER_TEMP/evidencias/m1b/"
      - run: npm run -s test:platform:queue-depth
      - run: npm run -s test:platform:home
      - run: npm run -s test:platform:organismo
      - run: npm run -s test:platform:visual-order
      - run: npm run -s test:platform:figma-parity
      - run: npm run -s test:platform:skills
      - run: npm run -s test:platform:r5
      - run: npm run -s test:platform:cadeia
      - name: guardas de governanca, sem FAIL_NOVO
        run: npx tsx tests/product/run-sem-fail-novo.ts
      # continue-on-error acima evita mascarar a cobertura das demais suites.
      # Esse passo torna o veredito final invariavelmente RED se HTTP nao passou.
      - name: P0 - impedir verde falso quando HTTP idempotencia falha
        if: ${{ always() && steps.http_device_gate.outcome != 'success' }}
        shell: bash
        run: |
          echo "::error::HTTP idempotencia/replay nao passou; PR DRAFT/HOLD/NO_GO"
          exit 1
      - name: P0 - nucleo real de recibos presente no mesmo HEAD do CI
        if: always()
        run: node tests/product/run-inbound-receipt-integration-presence-gate.cjs
      - name: Encerrar PostgreSQL descartavel
        if: always()
        shell: bash
        run: |
          if [[ -n "${DELIVERYOS_PG_DATA:-}" && -d "$DELIVERYOS_PG_DATA" ]]; then
            /usr/lib/postgresql/16/bin/pg_ctl -D "$DELIVERYOS_PG_DATA" -m immediate -w stop
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-product-ux
          path: ${{ runner.temp }}/evidencias/
          retention-days: 14
