name: CÉSAR OS CI Producer Review Check

# Pull-request validation only; no deployment, secrets, writes or scheduled runs.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/cesar-os-ci/**'
      - 'test/cesar-os-ci-*.test.mjs'
      - '.github/workflows/cesar-os-ci-producer-review.yml'

permissions:
  contents: read

concurrency:
  group: cesar-os-producer-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-producer:
    if: github.repository == 'cesarspichencoff-cmyk/delviery-os' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate producer and immutable archive
        run: node --test test/cesar-os-ci-snapshot.test.mjs
