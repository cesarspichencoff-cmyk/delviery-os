name: deliveryos-q026-memory-shadow
on:
  push:
    branches:
      - research/deliveryos-q026-memory-profile-20261009
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory-stages-100k:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
      Q026_EVENTS: "100000"
      NODE_OPTIONS: "--expose-gc"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: tipagem — sem emitir arquivos
        run: npx tsc --noEmit
      - name: memoria em cada etapa do read model, 100 mil fatos
        run: npx tsx tests/product/run-q026-memory-stage-shadow.ts

  memory-stages-1030k:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
