name: DeliveryOS branch validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/odhen-routing-config-proof-20260930

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck full repository
        run: npm run typecheck

      - name: Build full repository
        run: npm run build

      - name: Verify routing config
        run: npm run verificar:routing-config

      - name: Verify non-production items
        run: npm run verificar:non-production-items

      - name: Verify production print plan
        run: npm run verificar:production-print-plan

      - name: Verify production service matrix
        run: npm run verificar:production-service-matrix

      - name: Verify production ticket v2
        run: npm run verificar:production-ticket-v2

      - name: Verify production ticket E2E shadow
        run: npm run verificar:production-ticket-e2e

      - name: Verify native fiscal reconciler
        run: npm run verificar:native-fiscal-reconciler

      - name: Syntax-check shadow runtime
        run: |
          node --check runtime/shadow/live_shadow_consumer_v1.cjs
          node --check runtime/shadow/live_shadow_consumer_loop_v1.cjs
