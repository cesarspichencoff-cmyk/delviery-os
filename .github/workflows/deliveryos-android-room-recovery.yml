name: DeliveryOS Android Room Recovery
on:
  push:
    branches:
      - feat/deliveryos-android-room-recovery-20261009
      - feat/deliveryos-android-room-recovery-fixed-20261009
      - feat/deliveryos-android-orphan-recovery-20261009
      - feat/deliveryos-android-orphan-recovery-fixed-20261009
  pull_request:
    types: [synchronize, reopened]
    branches:
      - integration/deliveryos-v1-connected-20261102
    paths:
      - .github/workflows/deliveryos-android-room-recovery.yml
      - android/app/src/main/java/br/com/tata/entregas/sync/SyncWorker.kt
      - android/app/src/main/java/br/com/tata/entregas/sync/EventBatchHttpRejection.kt
      - android/app/src/main/java/br/com/tata/entregas/sync/EventBatchHttpRejectionRoom.kt
      - android/app/src/main/java/br/com/tata/entregas/sync/TermAckReceipt.kt
      - android/app/src/test/java/br/com/tata/entregas/EventBatchHttpRejectionTest.kt
      - android/app/src/test/java/br/com/tata/entregas/EventBatchHttpRejectionRoomTest.kt
      - android/app/src/test/java/br/com/tata/entregas/SyncWorkerWorkManager4xxTest.kt
      - android/app/src/test/java/br/com/tata/entregas/SyncSchedulerWorkManagerTest.kt
      - android/app/src/test/java/br/com/tata/entregas/TermAckLoopbackHttpRoomTest.kt
      - android/app/src/main/java/br/com/tata/entregas/data/EntregasDatabase.kt
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deliveryos-android-room-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-room:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android JVM Room recovery tests
        working-directory: android
        run: bash ./gradlew --no-daemon --console=plain testDebugUnitTest
      - name: Verify Android Room real-DAO regression and report
        if: always()
        working-directory: android
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          n=fail=err=0
          suites={}
          for file in files:
            root=ET.parse(file).getroot()
            n+=int(root.attrib.get("tests","0"))
            fail+=int(root.attrib.get("failures","0"))
            err+=int(root.attrib.get("errors","0"))
            suites[root.attrib.get("name", "")]=int(root.attrib.get("tests","0"))
          print(f"ANDROID_ROOM_JUNIT: suites={len(files)}, tests={n}, failures={fail}, errors={err}")
          # Fixture-only diagnostics; never print app payloads or test stdout.
          if fail or err:
            for file in files:
              suite=ET.parse(file).getroot()
              for case in suite.findall(".//testcase"):
                for tag in ("failure","error"):
                  node=case.find(tag)
                  if node is not None:
                    typ=node.attrib.get("type","unknown")[:120]
                    msg=node.attrib.get("message","").splitlines()
                    short=msg[0][:180] if msg else ""
                    print(f"ANDROID_JUNIT_FAIL_TYPE: {suite.attrib.get('name','')[:95]} {case.attrib.get('name','')[:95]} {typ} {short}")
          # The build is not proof if Android or the new Room integration never ran.
          expected={
            "br.com.tata.entregas.EventBatchHttpRejectionTest": 4,
            "br.com.tata.entregas.EventBatchHttpRejectionRoomTest": 6,
            "br.com.tata.entregas.RoomSyncRaceRecoveryTest": 8,
            "br.com.tata.entregas.SyncWorkerWorkManager4xxTest": 7,
            "br.com.tata.entregas.SyncSchedulerWorkManagerTest": 4,
            "br.com.tata.entregas.TermAckLoopbackHttpRoomTest": 8,
          }
          missing={key:minimum for key,minimum in expected.items()
                   if suites.get(key,0)<minimum}
          if not files or n==0 or fail or err or missing:
            raise SystemExit("ANDROID_ROOM_4XX_PROOF_MISSING_OR_FAILED: "+str(missing))
          print("ANDROID_ROOM_4XX_REAL_DAO_TEST_PASS")
          PY
