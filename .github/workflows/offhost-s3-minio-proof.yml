name: offhost-s3-minio-proof

on:
  push:
    branches:
      - tmp/offhost-s3-minio-proof-20261002

permissions:
  contents: read

jobs:
  s3-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit and type gates
        run: |
          set -euxo pipefail
          npx tsc --noEmit
          npm run test:entregas:backup-offhost-s3

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.8'
          cache: false

      - name: Build pinned MinIO tools from source
        env:
          GOBIN: /tmp/minio-bin
          GOTOOLCHAIN: auto
        run: |
          set -euxo pipefail
          mkdir -p "$GOBIN"

          go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
          go install github.com/minio/mc@RELEASE.2025-08-13T08-35-41Z

          install -m 700 "$GOBIN/minio" /tmp/minio
          install -m 700 "$GOBIN/mc" /tmp/mc

          /tmp/minio --version
          /tmp/mc --version
          go version -m /tmp/minio
          go version -m /tmp/mc
          sha256sum /tmp/minio /tmp/mc
          echo "MINIO_SOURCE_BUILD_GREEN"

      - name: Start ephemeral MinIO binary
        run: |
          set -euxo pipefail
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=rootadmin \
          MINIO_ROOT_PASSWORD=rootadmin-secret-20261002 \
            /tmp/minio server /tmp/minio-data --address 127.0.0.1:9000 \
            >/tmp/minio.log 2>&1 &
          echo $! >/tmp/minio.pid

          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              cat /tmp/minio.log
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/minio.log
          exit 1

      - name: Create bucket and least-privilege users
        run: |
          set -euxo pipefail

          cat >/tmp/write-policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Action": ["s3:PutObject"],
              "Resource": ["arn:aws:s3:::deliveryos-minio/deliveryos-backups/*"]
            }]
          }
          JSON

          cat >/tmp/read-policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::deliveryos-minio/deliveryos-backups/*"]
            }]
          }
          JSON

          /tmp/mc alias set local http://127.0.0.1:9000 \
            rootadmin rootadmin-secret-20261002
          /tmp/mc mb local/deliveryos-minio
          /tmp/mc admin policy create local deliveryos-write /tmp/write-policy.json
          /tmp/mc admin policy create local deliveryos-read /tmp/read-policy.json
          /tmp/mc admin user add local deliveryos-writer writer-secret-20261002
          /tmp/mc admin user add local deliveryos-reader reader-secret-20261002
          /tmp/mc admin policy attach local deliveryos-write --user deliveryos-writer
          /tmp/mc admin policy attach local deliveryos-read --user deliveryos-reader

      - name: Prove separated write/read credentials over real S3 API
        env:
          ENTREGAS_BACKUP_S3_ENDPOINT: http://127.0.0.1:9000
          ENTREGAS_BACKUP_S3_REGION: us-east-1
          ENTREGAS_BACKUP_S3_BUCKET: deliveryos-minio
          ENTREGAS_BACKUP_S3_PREFIX: deliveryos-backups
          ENTREGAS_BACKUP_S3_WRITE_ACCESS_KEY_ID: deliveryos-writer
          ENTREGAS_BACKUP_S3_WRITE_SECRET_ACCESS_KEY: writer-secret-20261002
          ENTREGAS_BACKUP_S3_READ_ACCESS_KEY_ID: deliveryos-reader
          ENTREGAS_BACKUP_S3_READ_SECRET_ACCESS_KEY: reader-secret-20261002
        run: |
          set -euxo pipefail
          npm run test:entregas:backup-offhost-s3:live

      - name: Inspect exactly three uploaded objects
        run: |
          set -euxo pipefail
          /tmp/mc ls --recursive --json local/deliveryos-minio/deliveryos-backups \
            | tee /tmp/s3-object-list.jsonl
          count=$(wc -l < /tmp/s3-object-list.jsonl)
          test "$count" = "3"
          echo "S3_OBJECT_COUNT=3"

      - name: Regression and repository cleanliness
        run: |
          set -euxo pipefail
          npm run test:entregas:backup-integrity
          npm run test:entregas:backup-export
          npm run test:platform:governanca
          git diff --check
          echo "OFFHOST_S3_MINIO_PROOF_GREEN"

      - name: Cleanup
        if: always()
        run: |
          if test -f /tmp/minio.pid; then
            kill "$(cat /tmp/minio.pid)" >/dev/null 2>&1 || true
          fi
          rm -rf /tmp/minio-data /tmp/minio /tmp/mc \
            /tmp/minio.sha256sum /tmp/mc.sha256sum \
            /tmp/write-policy.json /tmp/read-policy.json /tmp/minio.log /tmp/minio.pid
