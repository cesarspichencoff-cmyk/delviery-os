name: offhost-s3-minio-proof

on:
  push:
    branches:
      - tmp/offhost-s3-minio-proof-20261002

permissions:
  contents: read

jobs:
  s3-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit and type gates
        run: |
          set -euxo pipefail
          npx tsc --noEmit
          npm run test:entregas:backup-offhost-s3

      - name: Pull pinned official MinIO images
        run: |
          set -euxo pipefail
          MINIO_IMAGE='quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z'
          MC_IMAGE='quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z'

          docker pull "$MINIO_IMAGE"
          docker pull "$MC_IMAGE"

          echo "MINIO_IMAGE=$MINIO_IMAGE" >> "$GITHUB_ENV"
          echo "MC_IMAGE=$MC_IMAGE" >> "$GITHUB_ENV"
          docker image inspect "$MINIO_IMAGE" --format 'MINIO_REPODIGESTS={{json .RepoDigests}}'
          docker image inspect "$MC_IMAGE" --format 'MC_REPODIGESTS={{json .RepoDigests}}'
          echo "MINIO_IMAGES_PULL_GREEN"

      - name: Start ephemeral MinIO container
        run: |
          set -euxo pipefail
          docker rm -f deliveryos-minio >/dev/null 2>&1 || true
          docker run -d --name deliveryos-minio \
            -e MINIO_ROOT_USER=rootadmin \
            -e MINIO_ROOT_PASSWORD=rootadmin-secret-20261002 \
            -p 127.0.0.1:9000:9000 \
            "$MINIO_IMAGE" server /data --address :9000

          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              docker logs deliveryos-minio
              exit 0
            fi
            sleep 0.25
          done
          docker logs deliveryos-minio
          exit 1

      - name: Create bucket and least-privilege users
        run: |
          set -euxo pipefail

          cat >/tmp/write-policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Action": ["s3:PutObject"],
              "Resource": ["arn:aws:s3:::deliveryos-minio/deliveryos-backups/*"]
            }]
          }
          JSON

          cat >/tmp/read-policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::deliveryos-minio/deliveryos-backups/*"]
            }]
          }
          JSON

          mc() {
            docker run --rm --network host -v /tmp:/tmp \
              -e MC_HOST_local=http://rootadmin:rootadmin-secret-20261002@127.0.0.1:9000 \
              "$MC_IMAGE" "$@"
          }
          mc mb local/deliveryos-minio
          mc admin policy create local deliveryos-write /tmp/write-policy.json
          mc admin policy create local deliveryos-read /tmp/read-policy.json
          mc admin user add local deliveryos-writer writer-secret-20261002
          mc admin user add local deliveryos-reader reader-secret-20261002
          mc admin policy attach local deliveryos-write --user deliveryos-writer
          mc admin policy attach local deliveryos-read --user deliveryos-reader

      - name: Prove separated write/read credentials over real S3 API
        env:
          ENTREGAS_BACKUP_S3_ENDPOINT: http://127.0.0.1:9000
          ENTREGAS_BACKUP_S3_REGION: us-east-1
          ENTREGAS_BACKUP_S3_BUCKET: deliveryos-minio
          ENTREGAS_BACKUP_S3_PREFIX: deliveryos-backups
          ENTREGAS_BACKUP_S3_WRITE_ACCESS_KEY_ID: deliveryos-writer
          ENTREGAS_BACKUP_S3_WRITE_SECRET_ACCESS_KEY: writer-secret-20261002
          ENTREGAS_BACKUP_S3_READ_ACCESS_KEY_ID: deliveryos-reader
          ENTREGAS_BACKUP_S3_READ_SECRET_ACCESS_KEY: reader-secret-20261002
        run: |
          set -euxo pipefail
          npm run test:entregas:backup-offhost-s3:live

      - name: Inspect exactly three uploaded objects
        run: |
          set -euxo pipefail
          mc() {
            docker run --rm --network host \
              -e MC_HOST_local=http://rootadmin:rootadmin-secret-20261002@127.0.0.1:9000 \
              "$MC_IMAGE" "$@"
          }
          count=$(mc find local/deliveryos-minio/deliveryos-backups --type f | wc -l)
          test "$count" = "3"
          echo "S3_OBJECT_COUNT=3"
          mc find local/deliveryos-minio/deliveryos-backups --type f

      - name: Regression and repository cleanliness
        run: |
          set -euxo pipefail
          npm run test:entregas:backup-integrity
          npm run test:entregas:backup-export
          npm run test:platform:governanca
          git diff --check
          echo "OFFHOST_S3_MINIO_PROOF_GREEN"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f deliveryos-minio >/dev/null 2>&1 || true
          rm -rf /tmp/write-policy.json /tmp/read-policy.json
