name: deliveryos-q026-rr-scale-shadow
on:
  push:
    branches:
      - research/deliveryos-q026-rr-scale-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paced-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        n: [120000, 300000]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
      Q026_RR_SCALE_EVENTS: ${{ matrix.n }}
      Q026_RR_SCALE_RESULT: q026-rr-scale-${{ matrix.n }}.json
      NODE_OPTIONS: --expose-gc --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Project typecheck and strict load test
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --strict --esModuleInterop --skipLibCheck --types node tests/product/run-q026-rr-sustained-writes-shadow.ts
      - name: Synthetic PostgreSQL RR with 4 paired quiet and paced write samples
        run: npx tsx tests/product/run-q026-rr-sustained-writes-shadow.ts
      - uses: actions/upload-artifact@v4
        with:
          name: q026-scale-${{ matrix.n }}
          path: ${{ env.Q026_RR_SCALE_RESULT }}
          if-no-files-found: error
  compare-pairs:
    needs: [paced-writes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: q026-scale-*
          path: evidence
          merge-multiple: true
      - name: Prove both sizes, 8 independent reads and 150 commits
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          for(const n of [120000,300000]){
            const r=JSON.parse(fs.readFileSync('evidence/q026-rr-scale-'+n+'.json','utf8'));
            if(r.N!==n||r.warmups!==2||r.measured!==8||r.external_insert_commits!==150
               ||!r.all_snapshots_consistent||!r.all_backend_xmin_released)
              throw Error('Invalid scope proof: '+n);
            if(r.samples.filter(s=>s.arm==='quiet').length!==4
              ||r.samples.filter(s=>s.arm==='paced').length!==4)
              throw Error('Missing ABBA arms '+n);
            for(const s of r.samples){
              if(s.rr_wall_ms<=0||s.mvcc_upper_ms<=0||s.end_count<s.start_count)
                throw Error('Invalid timing or counts at '+n);
              if(s.arm==='paced'&& (s.writer_commits!==30||s.end_count-s.start_count!==30))
                throw Error('Paced writer invalid '+n);
              if(s.arm==='quiet'&& (s.writer_commits!==0||s.end_count!==s.start_count))
                throw Error('Quiet writer invalid '+n);
            }
            console.log('Q026_RR_PACED_EVIDENCE_PASS '+JSON.stringify({
              n,measured:r.measured,external_commits:r.external_insert_commits,
              quiet:r.arm_quiet,paced:r.arm_paced,
              limitation:'not production p95/p99 or 1.03M performance'
            }));
          }
          JS
