name: deliveryos-q026-pg-sort-cost-shadow
on:
  push:
    branches:
      - research/deliveryos-q026-pg-sort-cost-shadow-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg-sort-explain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck SQL plan experiment
        run: npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --strict --esModuleInterop --skipLibCheck --types node tests/product/run-q026-pg-sort-cost-shadow.ts
      - name: PostgreSQL 16 EXPLAIN ANALYZE, 132k facts, work_mem 64kB, hypothetical index
        run: npx tsx tests/product/run-q026-pg-sort-cost-shadow.ts


  pg-index-write-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck extra WAL/write experiment
        run: npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --strict --esModuleInterop --skipLibCheck --types node tests/product/run-q026-index-write-cost-shadow.ts
      - name: Synthetic insert/WAL cost with and without index (disposable PostgreSQL)
        run: npx tsx tests/product/run-q026-index-write-cost-shadow.ts
