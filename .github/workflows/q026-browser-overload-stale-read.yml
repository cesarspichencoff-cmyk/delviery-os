name: q026-browser-overload-stale-read
on:
  push:
    branches:
      - research/q026-browser-overload-stale-read-proof-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-real-http:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for native DOM/browser evidence
        run: npx playwright install --with-deps chromium
      - name: Typecheck actual Chromium scenario
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --strict --esModuleInterop --skipLibCheck --types node tests/product/run-q026-browser-overload-proof.ts
      - name: Browser proves previous reading survives PG backlog and recovers
        shell: bash
        run: |
          set -o pipefail
          npx tsx tests/product/run-q026-browser-overload-proof.ts | tee q026-browser.out
          grep '^Q026_BROWSER_STALE_READING_503_PASS ' q026-browser.out
          grep '^Q026_BROWSER_503_FIRST_LOAD_AND_RECOVERY_PASS ' q026-browser.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q026-browser-chromium-proof
          path: |
            q026-browser-*.png
            q026-browser.out
          if-no-files-found: warn
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:platform:product
      - run: npm run test:platform:q016
      - run: npm run test:platform:governanca
      - name: Cannot fake browser PASS without PG
        shell: bash
        run: |
          set +e
          DELIVERYOS_PG_URL= npx tsx tests/product/run-q026-browser-overload-proof.ts
          test "$?" = 78
