# APK de CAMPO assinado — só por tag `entregas-campo-*`, nunca por push comum.
# A chave fica nos segredos criptografados do projeto no GitHub (o repositório
# é público: chave em arquivo permitiria assinar um app falso do motoboy).
# Sem os segredos e as variáveis, o workflow FALHA — não gera APK sem assinatura.
name: DeliveryOS Android field release
on:
  push:
    tags: ["entregas-campo-*"]
permissions:
  contents: read
jobs:
  field-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Exigir segredos e enderecos HTTPS do piloto
        env:
          KS: ${{ secrets.ENTREGAS_PILOT_KEYSTORE_B64 }}
          KSP: ${{ secrets.ENTREGAS_PILOT_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ENTREGAS_PILOT_KEY_ALIAS }}
          KP: ${{ secrets.ENTREGAS_PILOT_KEY_PASSWORD }}
          BASE: ${{ vars.ENTREGAS_PILOT_BASE_URL }}
          PLAT: ${{ vars.ENTREGAS_PILOT_PLATFORM_URL }}
        run: |
          set -euo pipefail
          for v in KS KSP KA KP BASE PLAT; do
            if [ -z "${!v}" ]; then echo "::error::falta $v (segredo/variavel do projeto)"; exit 1; fi
          done
          case "$BASE$PLAT" in *http://*) echo "::error::endereco sem HTTPS"; exit 1;; esac
      - name: APK pilot (sem assinatura no build) assinado no runner com zipalign + apksigner
        working-directory: android
        env:
          KS: ${{ secrets.ENTREGAS_PILOT_KEYSTORE_B64 }}
          KSP: ${{ secrets.ENTREGAS_PILOT_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ENTREGAS_PILOT_KEY_ALIAS }}
          KP: ${{ secrets.ENTREGAS_PILOT_KEY_PASSWORD }}
          BASE: ${{ vars.ENTREGAS_PILOT_BASE_URL }}
          PLAT: ${{ vars.ENTREGAS_PILOT_PLATFORM_URL }}
        run: |
          set -euo pipefail
          # O build.gradle.kts continua sem nenhuma config de assinatura (guarda
          # estrutural): a assinatura acontece aqui, com a chave só no runner.
          ks="$RUNNER_TEMP/campo.jks"
          printf '%s' "$KS" | base64 -d > "$ks"
          trap 'rm -f "$ks"' EXIT
          bash ./gradlew --no-daemon --console=plain :app:assemblePilot -Pentregas.baseUrl="$BASE" -Pentregas.platformUrl="$PLAT"
          unsigned=$(ls app/build/outputs/apk/pilot/*.apk | head -n 1)
          tools=$(dirname "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)")
          mkdir -p "$RUNNER_TEMP/campo"
          out="$RUNNER_TEMP/campo/entregas-pilot-campo.apk"
          "$tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/alinhado.apk"
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias "$KA" --ks-pass env:KSP --key-pass env:KP --out "$out" "$RUNNER_TEMP/alinhado.apk"
          "$tools/apksigner" verify --print-certs "$out" | grep -i "certificate SHA-256" | head -1
          (cd "$RUNNER_TEMP/campo" && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: entregas-apk-campo-assinado
          path: ${{ runner.temp }}/campo/
          if-no-files-found: error
          retention-days: 30
