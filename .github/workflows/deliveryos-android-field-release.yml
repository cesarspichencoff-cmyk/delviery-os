# A assinatura de campo usa a custódia do projeto e exige uma tag de campo.
# Na branch de trabalho, só há ensaio com chave descartável e domínios .invalid.
name: DeliveryOS Android field release
on:
  push:
    branches: [feat/entregas-fila-propria-itaim]
    tags: ["entregas-campo-*"]
    paths:
      - .github/workflows/deliveryos-android-field-release.yml
      - android/app/src/main/**
      - android/app/build.gradle.kts
      - android/app/proguard-rules.pro
      - android/gradle/**
      - tools/android_compilar_assinar_piloto.sh
      - tools/entregas_android_pilot_proof.py
      - tools/entregas_android_lab_package.py
      - tests/android/run_pilot_apk_lab.sh
permissions:
  contents: read
jobs:
  pilot-apk-lab:
    if: github.ref_type == 'branch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 26, sdk: '26', arch: x86 }
          - { api: 37, sdk: '37.0', arch: x86_64 }
    name: APK pilot lab / Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build, sign, verify and install the pilot variant using lab-only inputs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.sdk }}
          target: google_apis
          arch: ${{ matrix.arch }}
          working-directory: android
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash ../tests/android/run_pilot_apk_lab.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        with:
          name: entregas-pilot-apk-evidence-api${{ matrix.api }}
          path: android-pilot-package-proof.txt
          if-no-files-found: error
          retention-days: 7

  field-apk:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'entregas-campo-')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build and sign the field package under the authorized custody
        env:
          KS: ${{ secrets.ENTREGAS_PILOT_KEYSTORE_B64 }}
          KSP: ${{ secrets.ENTREGAS_PILOT_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ENTREGAS_PILOT_KEY_ALIAS }}
          KP: ${{ secrets.ENTREGAS_PILOT_KEY_PASSWORD }}
          BASE: ${{ vars.ENTREGAS_PILOT_BASE_URL }}
          PLAT: ${{ vars.ENTREGAS_PILOT_PLATFORM_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          for name in ("BASE", "PLAT"):
              host = (urlsplit(os.environ[name]).hostname or "").lower().rstrip(".")
              if not host or host.endswith((".invalid", ".example")):
                  raise SystemExit("FIELD_ORIGIN_UNAVAILABLE_" + name)
          PY
          bash tools/android_compilar_assinar_piloto.sh "$RUNNER_TEMP/campo/entregas-pilot-campo.apk"
          (cd "$RUNNER_TEMP/campo" && sha256sum entregas-pilot-campo.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: entregas-apk-campo-assinado
          path: ${{ runner.temp }}/campo/
          if-no-files-found: error
          retention-days: 30
