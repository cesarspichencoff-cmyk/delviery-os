# APK de CAMPO assinado — só por tag `entregas-campo-*`, nunca por push comum.
# A chave fica nos segredos criptografados do projeto no GitHub (o repositório
# é público: chave em arquivo permitiria assinar um app falso do motoboy).
# Sem os segredos e as variáveis, o workflow FALHA — não gera APK sem assinatura.
name: DeliveryOS Android field release
on:
  push:
    tags: ["entregas-campo-*"]
permissions:
  contents: read
jobs:
  field-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Exigir segredos e enderecos HTTPS do piloto
        env:
          KS: ${{ secrets.ENTREGAS_PILOT_KEYSTORE_B64 }}
          KSP: ${{ secrets.ENTREGAS_PILOT_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ENTREGAS_PILOT_KEY_ALIAS }}
          KP: ${{ secrets.ENTREGAS_PILOT_KEY_PASSWORD }}
          BASE: ${{ vars.ENTREGAS_PILOT_BASE_URL }}
          PLAT: ${{ vars.ENTREGAS_PILOT_PLATFORM_URL }}
        run: |
          set -euo pipefail
          for v in KS KSP KA KP BASE PLAT; do
            if [ -z "${!v}" ]; then echo "::error::falta $v (segredo/variavel do projeto)"; exit 1; fi
          done
          case "$BASE$PLAT" in *http://*) echo "::error::endereco sem HTTPS"; exit 1;; esac
      - name: APK pilot assinado (chave decodificada so no runner)
        working-directory: android
        env:
          KS: ${{ secrets.ENTREGAS_PILOT_KEYSTORE_B64 }}
          ENTREGAS_PILOT_KEYSTORE_PASSWORD: ${{ secrets.ENTREGAS_PILOT_KEYSTORE_PASSWORD }}
          ENTREGAS_PILOT_KEY_ALIAS: ${{ secrets.ENTREGAS_PILOT_KEY_ALIAS }}
          ENTREGAS_PILOT_KEY_PASSWORD: ${{ secrets.ENTREGAS_PILOT_KEY_PASSWORD }}
          BASE: ${{ vars.ENTREGAS_PILOT_BASE_URL }}
          PLAT: ${{ vars.ENTREGAS_PILOT_PLATFORM_URL }}
        run: |
          set -euo pipefail
          export ENTREGAS_PILOT_KEYSTORE="$RUNNER_TEMP/campo.jks"
          printf '%s' "$KS" | base64 -d > "$ENTREGAS_PILOT_KEYSTORE"
          trap 'rm -f "$ENTREGAS_PILOT_KEYSTORE"' EXIT
          bash ./gradlew --no-daemon --console=plain :app:assemblePilot -Pentregas.baseUrl="$BASE" -Pentregas.platformUrl="$PLAT"
          apk=$(ls app/build/outputs/apk/pilot/*.apk | head -n 1)
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --print-certs "$apk" | grep -i "certificate SHA-256" | head -1
          mkdir -p "$RUNNER_TEMP/campo" && cp "$apk" "$RUNNER_TEMP/campo/"
          (cd "$RUNNER_TEMP/campo" && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: entregas-apk-campo-assinado
          path: ${{ runner.temp }}/campo/
          if-no-files-found: error
          retention-days: 30
