name: deliveryos-q026-single-snapshot-candidate
on:
  push:
    branches:
      - research/deliveryos-q026-single-snapshot-candidate-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg-read-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript complete project + strict new regression test
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --strict --esModuleInterop --skipLibCheck --types node tests/product/run-q026-single-snapshot-candidate-pg.ts
      - name: Q026 live PostgreSQL single snapshot with deterministic writer and mutant negative controls
        run: npx tsx tests/product/run-q026-single-snapshot-candidate-pg.ts
      - name: Legacy Q016 replay invariants
        run: npm run test:platform:q016
      - name: Product Entregas PostgreSQL contract
        run: npx tsx tests/product/run-entregas-servidor-pg-tests.ts
      - name: Existing Entregas reader and governance guards
        run: |
          npx tsx tests/product/run-entregas-leitura-da-rua-tests.ts
          npm run test:platform:governanca
