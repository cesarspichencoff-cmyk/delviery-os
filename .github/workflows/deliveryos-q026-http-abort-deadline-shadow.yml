name: deliveryos-q026-http-abort-deadline-shadow
# SHADOW ONLY. localhost HTTP, isolated Postgres 16, no product route edits.
on:
  push:
    branches:
      - research/deliveryos-q026-http-abort-deadline-shadow-20261010
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q026-http-abort-${{ github.ref }}
  cancel-in-progress: true
jobs:
  http-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        events: [20000, 120000]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
      Q026_HTTP_EVENTS: ${{ matrix.events }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck shadow localhost HTTP handler
        run: npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --strict --esModuleInterop --skipLibCheck --types node tests/product/run-q026-http-disconnect-deadline-shadow.ts
      - name: Real sockets, pool backpressure, server cancel and fresh replay
        shell: bash
        run: |
          set -o pipefail
          npx tsx tests/product/run-q026-http-disconnect-deadline-shadow.ts | tee q026-http-abort.out
          grep '^Q026_HTTP_DISCONNECT_PASS ' q026-http-abort.out
          grep '^Q026_HTTP_DEADLINE_PASS ' q026-http-abort.out
          grep '^Q026_HTTP_LIFECYCLE_SHADOW_PASS ' q026-http-abort.out
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:platform:q016
      - run: npm run test:platform:product
      - run: npm run test:platform:governanca
      - name: Refuse false pass without PostgreSQL
        shell: bash
        run: |
          set +e
          DELIVERYOS_PG_URL= npx tsx tests/product/run-q026-http-disconnect-deadline-shadow.ts
          code=$?
          echo "no_db_exit=$code"
          test "$code" = 78
