name: CI Snapshot Candidate Read-Only Proof

# One-off candidate-path validation; no schedule and no repository write permission.
on:
  push:
    branches:
      - cesar-os/work-ci-snapshot-candidate-20261010
    paths:
      - .github/workflows/cesar-os-ci-snapshot-readonly-proof.yml

permissions: {}

concurrency:
  group: deliveryos-ci-snapshot-proof
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'cesarspichencoff-cmyk/delviery-os' && github.ref == 'refs/heads/cesar-os/work-ci-snapshot-candidate-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout candidate for static local tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify snapshot producer rules
        run: node --test test/cesar-os-ci-snapshot.test.mjs

      - name: Authenticated bounded GitHub Actions read — no publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "import {collect} from './tools/cesar-os-ci/snapshot.mjs'; const s=await collect(process.env.GITHUB_TOKEN); console.log(JSON.stringify({status:'READ_ONLY_GITHUB_TOKEN_PROOF',repository:s.repository,collection_basis:s.collection_basis,record_count:s.record_count,coverage:s.coverage_status,raw_payload_persisted:s.raw_payload_persisted,possible_commitment:s.possible_commitment}));"
