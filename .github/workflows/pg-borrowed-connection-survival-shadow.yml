name: pg-borrowed-connection-survival-shadow
# Only a PR candidate: tests shared SQL adapter after killed PostgreSQL sessions.
on:
  pull_request:
    branches:
      - integration/deliveryos-product-ux-android-20261009
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pg-borrowed-connection-${{ github.ref }}
  cancel-in-progress: true
jobs:
  broken-connection-regression:
    name: PG borrowed connection survives forced termination
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record real PR merge tree
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD)"
          test "$tree" = "$GITHUB_SHA"
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            test -n "$PR_BASE_SHA" && test -n "$PR_HEAD_SHA"
          fi
          echo "PG_CONNECTION_FIX_TESTED_TREE event=$GITHUB_EVENT_NAME base=${PR_BASE_SHA:-none} head=${PR_HEAD_SHA:-none} tested=$tree"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund tsx@4.23.15
      - name: Strict TypeScript compile and core regression
        run: |
          set -e
          npx tsc --noEmit
          npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --strict --esModuleInterop --skipLibCheck --types node tests/product/run-q026-mvcc-conexao-derrubada.ts
          npm run test:platform:q016
          npm run test:platform:product
          npm run test:platform:governanca
      - name: Start private, disposable PostgreSQL16
        shell: bash
        run: |
          set -euo pipefail
          PG_BIN=/usr/lib/postgresql/16/bin
          PG_DATA="$RUNNER_TEMP/pg-survival-pg16"
          test -x "$PG_BIN/initdb" && test -x "$PG_BIN/pg_ctl"
          "$PG_BIN/initdb" -D "$PG_DATA" --username=postgres --auth-local=trust --auth-host=trust --encoding=UTF8 --locale=C >/dev/null
          if ! "$PG_BIN/pg_ctl" -D "$PG_DATA" -l "$RUNNER_TEMP/pg-survival.log" -o "-h 127.0.0.1 -p 5432 -k $RUNNER_TEMP" -w start; then
            cat "$RUNNER_TEMP/pg-survival.log"
            exit 1
          fi
          version="$(psql -h 127.0.0.1 -U postgres -d postgres -Atc 'SHOW server_version_num')"
          test "$version" -ge 160000 && test "$version" -lt 170000
          echo "PG_SESSION_SURVIVAL_EPHEMERAL_PG16_READY version=$version"
      - name: Kill active, idle and timed-out PG sessions; client and next query must survive
        shell: bash
        run: |
          set -euo pipefail
          npx tsx tests/product/run-q026-mvcc-conexao-derrubada.ts | tee pg-survival.log
          grep '^Q026_DERRUBADA_RESULTADO ' pg-survival.log
          grep '^Q026_DERRUBADA_RESULTADO .*"falhas":0' pg-survival.log
      - name: Existing SQL repository regression against ephemeral PG
        shell: bash
        run: |
          set -euo pipefail
          npx tsx src/platform/run-pg-repository-tests.ts
      - name: Database missing must NOT pass
        shell: bash
        run: |
          set +e
          DELIVERYOS_PG_URL= npx tsx tests/product/run-q026-mvcc-conexao-derrubada.ts >pg-missing.log 2>&1
          code=$?
          set -e
          test "$code" -eq 78
          grep 'Nenhuma sessao foi derrubada' pg-missing.log
      - name: Shut down disposable PG
        if: ${{ always() }}
        shell: bash
        run: |
          PG_DATA="$RUNNER_TEMP/pg-survival-pg16"
          if test -f "$PG_DATA/postmaster.pid"; then
            /usr/lib/postgresql/16/bin/pg_ctl -D "$PG_DATA" -m fast -w stop
          fi
