# Only this review branch and PR target; no signing, credentials, deploy or physical device.
name: DeliveryOS Android GPS persistence review
on:
  pull_request:
    branches:
      - claude/deliveryos-v1-candidato-homologacao-20261101
    paths:
      - 'android/**'
      - '.github/workflows/deliveryos-android-gps-persistence-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-gps-persistence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test Android with real Room/Robolectric, no GPS
        working-directory: android
        run: bash ./gradlew --no-daemon --console=plain :app:testDebugUnitTest
      - name: Verify targeted test suite results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          names={'DurableLocationPublicationTest','LocationBackendSelectorTest','DurableLocationRoomTest'}
          found=set(); tests=failures=errors=0
          for path in glob.glob('android/app/build/test-results/testDebugUnitTest/*.xml'):
              root=ET.parse(path).getroot()
              klass=root.get('name','').rsplit('.',1)[-1]
              if klass in names:
                  found.add(klass)
                  tests+=int(root.get('tests',0))
                  failures+=int(root.get('failures',0))
                  errors+=int(root.get('errors',0))
          print(f'GPS_ANDROID_REVIEW_JUNIT classes={len(found)}/3 tests={tests} failures={failures} errors={errors}')
          if found!=names or failures or errors:
              raise SystemExit('TARGETED_JUNIT_NOT_PROVEN')
          PY
