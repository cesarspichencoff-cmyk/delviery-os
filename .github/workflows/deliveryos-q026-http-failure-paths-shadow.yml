name: deliveryos-q026-http-failure-paths-shadow
# Never use production credentials. Test DB is isolated and disposable PG16.
on:
  push:
    branches:
      - research/q026-queued-client-abort-shadow-20261010
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q026-failure-paths-${{ github.ref }}
  cancel-in-progress: true
jobs:
  failure-path:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        case: [queued_disconnect, pool_checkout_fast, permission_denied]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
      Q026_FAILURE_PATH_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck adversarial scenarios and candidate
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --strict --esModuleInterop --skipLibCheck --types node tests/product/run-q026-http-failure-paths-shadow.ts
      - name: Actual HTTP failure path with disposable PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          npx tsx tests/product/run-q026-http-failure-paths-shadow.ts | tee failure-path.log
          if [ "$Q026_FAILURE_PATH_CASE" = cancel_denied ]; then
            grep '^Q026_CANCEL_DENIED_FALLBACK_PASS ' failure-path.log
          elif [ "$Q026_FAILURE_PATH_CASE" = pool_saturated ]; then
            grep '^Q026_POOL_CONTENTION_PASS ' failure-path.log
          elif [ "$Q026_FAILURE_PATH_CASE" = pool_checkout_fast ]; then
            grep '^Q026_POOL_CHECKOUT_FAST_PASS ' failure-path.log
          elif [ "$Q026_FAILURE_PATH_CASE" = permission_denied ]; then
            grep '^Q026_PERMISSION_DENIED_DISTINCT_PASS ' failure-path.log
          else
            grep '^Q026_QUEUED_CLIENT_DISCONNECT_PASS ' failure-path.log
          fi
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:platform:q016
      - run: npm run test:platform:product
      - run: npm run test:platform:governanca
      - name: PostgreSQL absence is not success
        shell: bash
        run: |
          set +e
          DELIVERYOS_PG_URL= Q026_FAILURE_PATH_CASE=pool_saturated npx tsx tests/product/run-q026-http-failure-paths-shadow.ts
          code=$?
          test "$code" = 78
