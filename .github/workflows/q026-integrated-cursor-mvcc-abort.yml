name: q026-integrated-cursor-mvcc-abort
on:
  push:
    branches:
      - research/q026-incremental-mvcc-abort-proof-20261010
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q026-real-cursor-mvcc-abort-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-cursor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck actual reusable RR read and MVCC fixture
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --strict --esModuleInterop --skipLibCheck --types node tests/product/run-q026-integrated-cursor-mvcc-abort.ts
      - name: Prove one RR snapshot despite concurrent commit and recover after fetch abort
        shell: bash
        run: |
          set -o pipefail
          npx tsx tests/product/run-q026-integrated-cursor-mvcc-abort.ts | tee q026-mvcc.out
          grep '^Q026_INCREMENTAL_MVCC_CONCURRENT_COMMIT_PASS ' q026-mvcc.out
          grep '^Q026_INCREMENTAL_FETCH_ABORT_ROLLBACK_PASS ' q026-mvcc.out
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:platform:q016
      - run: npm run test:platform:product
      - run: npm run test:platform:governanca
      - name: Missing database fails visibly
        shell: bash
        run: |
          set +e
          DELIVERYOS_PG_URL= npx tsx tests/product/run-q026-integrated-cursor-mvcc-abort.ts
          test "$?" = 78
