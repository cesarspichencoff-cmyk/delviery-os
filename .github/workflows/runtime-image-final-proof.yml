name: runtime-image-final-proof

on:
  push:
    branches:
      - tmp/runtime-image-final-proof-20261002

permissions:
  contents: read

jobs:
  runtime-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build final runtime image
        run: |
          set -euxo pipefail
          docker version
          docker build --progress=plain \
            -f deploy/Dockerfile.platform \
            --build-arg DELIVERYOS_COMMIT="$GITHUB_SHA" \
            -t deliveryos-platform:proof \
            .

      - name: Inspect final image invariants
        run: |
          set -euxo pipefail
          docker image inspect deliveryos-platform:proof > /tmp/image.json

          python - <<'PY'
          import json
          img = json.load(open("/tmp/image.json", encoding="utf-8"))[0]
          cfg = img["Config"]
          assert cfg["User"] == "node", cfg["User"]
          assert cfg["Entrypoint"] == ["dumb-init", "--"], cfg["Entrypoint"]
          assert not cfg.get("Cmd"), cfg.get("Cmd")
          size = int(img["Size"])
          assert size > 0
          print(f"FINAL_IMAGE_SIZE_BYTES={size}")
          print("FINAL_IMAGE_CONFIG_GREEN")
          PY

          docker run --rm --read-only --tmpfs /tmp \
            -e EXPECT_SHA="$GITHUB_SHA" \
            deliveryos-platform:proof \
            sh -lc '
              set -eu
              test "$(id -u)" != "0"
              test -x "$(command -v dumb-init)"
              dumb-init --version
              test "$(stat -c "%U:%G" /app/dist)" = "node:node"
              test "$(stat -c "%U:%G" /app/node_modules)" = "node:node"
              test -d /app/node_modules/pg
              test ! -e /app/node_modules/typescript
              test ! -e /app/node_modules/playwright
              node -e "require(\"pg\"); const s=require(\"./dist/build-stamp.json\"); if(s.commit!==process.env.EXPECT_SHA){console.error(s); process.exit(3)}; console.log(\"BUILD_STAMP_OK\",s.commit)"
              npm ls --omit=dev --depth=0
              echo "FINAL_IMAGE_FILESYSTEM_GREEN"
            '

      - name: Execute real runtime binary in final image
        run: |
          set -euxo pipefail
          docker run --rm --read-only --tmpfs /tmp \
            -e DELIVERYOS_SOURCE_INGEST_ENABLED=false \
            deliveryos-platform:proof \
            node dist/src/platform/bin/entregas-source-ingest.js
          echo "FINAL_IMAGE_REAL_BINARY_GREEN"

      - name: Prove PID1 signal forwarding in final image
        run: |
          set -euxo pipefail
          docker run -d --name deliveryos-signal-proof \
            --read-only --tmpfs /tmp \
            deliveryos-platform:proof \
            node -e 'process.on("SIGTERM",()=>{console.log("FINAL_IMAGE_SIGTERM_CHILD");process.exit(0)});console.log("FINAL_IMAGE_CHILD_READY");setInterval(()=>{},1000)'

          for i in $(seq 1 50); do
            if docker logs deliveryos-signal-proof 2>&1 | grep -q FINAL_IMAGE_CHILD_READY; then
              break
            fi
            sleep 0.2
          done

          docker logs deliveryos-signal-proof
          docker logs deliveryos-signal-proof 2>&1 | grep -q FINAL_IMAGE_CHILD_READY
          docker exec deliveryos-signal-proof sh -lc 'tr "\000" " " < /proc/1/cmdline' | tee /tmp/pid1.txt
          grep -q 'dumb-init' /tmp/pid1.txt

          docker stop -t 5 deliveryos-signal-proof
          test "$(docker inspect -f '{{.State.ExitCode}}' deliveryos-signal-proof)" = "0"
          docker logs deliveryos-signal-proof
          docker logs deliveryos-signal-proof 2>&1 | grep -q FINAL_IMAGE_SIGTERM_CHILD
          docker rm deliveryos-signal-proof

          echo "FINAL_IMAGE_PID1_SIGTERM_GREEN"

      - name: Measure runtime filesystem
        run: |
          set -euxo pipefail
          docker run --rm --read-only --tmpfs /tmp deliveryos-platform:proof \
            sh -lc 'du -sb /app /app/node_modules /app/dist'
          echo "FINAL_IMAGE_MEASURED"

      - name: Repository cleanliness
        run: git diff --check
