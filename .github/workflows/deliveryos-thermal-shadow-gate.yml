name: DeliveryOS Thermal Shadow Gate

# PR-only verification: one run per change, including changes to fixtures,
# routing/rules, documentation, or dependencies. No path-filter blind spots.
on:
  pull_request:
    branches:
      - feat/thermal-quality-v51-epson-official-fontqa-20261008
      - feat/thermal-v54-caixa-photo-visual-qa-20261008
      - feat/thermal-v63-packaging-bridge-shadow-20261010
      - validation/thermal-v714-raw-quantity-fail-closed-20261011
      - fix/comandas-figma-box-count-guard-20261013

permissions:
  contents: read

concurrency:
  group: thermal-shadow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

