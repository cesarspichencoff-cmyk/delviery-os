name: DeliveryOS Thermal Shadow Gate

# PR-only verification: one run per change, including changes to fixtures,
# routing/rules, documentation, or dependencies. No path-filter blind spots.
on:
  pull_request:
    branches:
      - feat/thermal-quality-v51-epson-official-fontqa-20261008
      - feat/thermal-v54-caixa-photo-visual-qa-20261008
      - feat/thermal-v63-packaging-bridge-shadow-20261010
      - validation/thermal-v714-raw-quantity-fail-closed-20261011

permissions:
  contents: read

concurrency:
  group: thermal-shadow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  thermal-shadow:
    name: Offline thermal proof (fail closed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout snapshot
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Operational ticket semantic projection V4.5
        run: npm run verificar:tickets-operacionais-v45
      - name: Conference proven box grouping and finishing V6.2 (offline)
        run: node tools/verificar_agrupamento_conferencia_v62.js
      - name: Current packaging motor bridge V6.3 (offline, source-pinned)
        run: node tools/verificar_ponte_embalagem_v63.js
      - name: Three-way physical box and resource coherence V6.4 (offline)
        run: node tools/verificar_coerencia_tres_vias_v64.js
      - name: Reconciled reader ingress and pinned Unified Kit Core V6.6 (offline)
        run: node tools/verificar_ingresso_leitor_v66.js
      - name: Single reviewed future candidate and operational HOLD V7.16
        run: node tools/verificar_release_hold_v716.js
      - name: Consumed-rule bytes and engine mutation guard V7.14 (offline only)
        run: node tools/verificar_identidade_bytes_v714.js
      - name: Exact raw store-shop-order key integrity V7.27 (offline)
        run: node tools/verificar_identidade_pedido_v727.js
      - name: Passive real watcher-event audit privacy and integrity V7.30 (synthetic)
        run: node tools/verificar_auditoria_eventos_v730.js
      - name: Windows sidecar shift-and-V2 pin preflight V7.31 (synthetic only)
        run: node tools/verificar_sidecar_preflight_windows_v731.js
      - name: Adversarial 21-case iFood/Teknisa operational lunch simulation
        run: node tools/verificar_riscos_almoco_v735_offline.js
      - name: Windows Sandbox closed-loop config and host isolation V7.33 (static)
        run: node tools/verificar_sandbox_comandas_v733.js
      - name: Positive pinned canonical engine V2 to V6.8 three-way replay V7.22 (offline)
        run: node tools/verificar_cadeia_positiva_v722_offline.js
      - name: Immutable eight-rule subprocess snapshot and lineage guard V7.24 (offline)
        run: node tools/verificar_snapshot_fontes_v724_offline.js
      - name: Bounded fd source read symlink FIFO and mutation guard V7.25 (offline)
        run: node tools/verificar_fd_source_v725_offline.js
      - name: Passive Windows audit script contract V7.23 (static, no Windows)
        run: node tools/verificar_auditoria_servico_windows_v723.js
      - name: Parse passive Windows audit PowerShell V7.23 without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "tools/auditar_servico_windows_v723_readonly.ps1",
            [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) {
            throw "V723_POWERSHELL_SYNTAX_INVALID"
          }
          Write-Output "V723_POWERSHELL_PARSE_PASS=1 NO_SCRIPT_EXECUTION NO_WINDOWS_ACCESS"
      - name: Windows process topology passive observation privacy V7.29 (static/synthetic)
        run: node tools/verificar_topologia_windows_v729.js
      - name: Parse Windows process topology probe V7.29 without executing
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "tools/auditar_topologia_windows_v729_readonly.ps1",
            [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) {
            throw "V729_POWERSHELL_SYNTAX_INVALID"
          }
          Write-Output "V729_POWERSHELL_PARSE_PASS=1 NO_SCRIPT_EXECUTION NO_WINDOWS_ACCESS"
      - name: Execute passive topology probe on Linux CI only and validate privacy envelope
        shell: bash
        run: |
          pwsh -NoProfile -File tools/auditar_topologia_windows_v729_readonly.ps1 > "$RUNNER_TEMP/passive-topology-v729.json"
          node tools/validar_topologia_windows_v729.js "$RUNNER_TEMP/passive-topology-v729.json"
          node -e 'const p=require(process.argv[1]); if(p.service.lookup!=="UNREADABLE" || p.topology.scan!=="UNREADABLE" || p.authorizes_cutover!==false) process.exit(2);' "$RUNNER_TEMP/passive-topology-v729.json"
          echo "V729_LINUX_FAIL_CLOSED_SMOKE=1 NO_WINDOWS_SERVICE NO_REMOTE NO_PRINT"
      - name: No self-declared human bag or kit approval V7.13 (offline only)
        run: node tools/verificar_override_authority_v713.js
      - name: Human bag-kit override exact snapshot scope V7.12 (offline only)
        run: node tools/verificar_override_snapshot_v712.js
      - name: Read-only eight asset preflight V7.11 (no Windows effect)
        run: node tools/verificar_preflight_consumidor_v711.js
      - name: Installed V2 consumer parity and eight-rule lineage V7.10 (offline only)
        run: node tools/verificar_consumidor_shadow_v710.js
      - name: Stable Windows reader event/decision pairing V6.8 (offline)
        run: node tools/verificar_par_evento_leitor_v68.js
      - name: Payment-note policy V8.0 strict opt-in and item-note preservation (synthetic offline)
        run: node tools/verificar_nota_pagamento_v80_offline.js
      - name: Static exact bag policy B1 B5 B8 B9 in ephemeral V2 motor (Linux)
        run: node tools/verificar_sacolas_estaticas_v81_offline.js
      - name: V8.2 native reader envelope is NOT independent V6.8 source proof (Linux)
        run: node tools/verificar_comandas_v68_envelope_boundary_v82.cjs
      - name: Passive real-file reader audit V6.9 (offline fixtures, no effects)
        run: node tools/verificar_auditoria_leitor_v69.js
      - name: Future shift renewal review V7.0 (never modify installed state)
        run: node tools/verificar_revisao_turno_humano_v70.js
      - name: Item quantity integrity V5.9
        run: npm run verificar:quantidades-termicas-v59
      - name: Archived tickets V4.6
        run: npm run verificar:tickets-reais-v46
      - name: Two kitchen tickets V4.7
        run: npm run verificar:two-kitchen-v47
      - name: Kitchen replay V4.8
        run: npm run verificar:kitchen-real-v48
      - name: Sushi Quente V4.9
        run: npm run verificar:kitchen-sushi-quente-v49
      - name: Epson command and geometry V5.1
        run: npm run verificar:thermal-official-v51
      - name: CAIXA-only scope V5.3 (static)
        run: npm run verificar:thermal-caixa-only-v53
      - name: CAIXA comparison V5.4 (offline)
        run: npm run verificar:comparativo-caixa-v54
      - name: Typography V5.5 (offline)
        run: npm run verificar:cobertura-tipografica-v55
      - name: Long observations V5.6 (offline)
        run: npm run verificar:observacoes-legiveis-v56
      - name: Long observations integration V6.7 (offline)
        run: node tools/verificar_integracao_observacoes_v67.js
      - name: Invisible characters V5.7 (offline)
        run: npm run verificar:caracteres-invisiveis-v57
      - name: Resource integrity
        run: npm run verificar:resource-consumption
      - name: TATA sequence scope
        run: npm run verificar:tata-sequence-policy
      - name: Semantic job eligibility V5.10 (Issue 25)
        run: node tools/verificar_gate_semantico_termico_v510.js
      - name: Three original Figma 80mm receipt SVG goldens V7.2 (no redraw)
        run: node tools/verificar_desenho_comandas_v72.js
      - name: Direct Epson renderer source-semantic rejection V7.1 (Issue 25)
        run: node tools/verificar_renderer_semantico_direto_v71.js
      - name: Modern Epson GS L fn112/fn50 byte golden V7.47 (offline, Linux)
        run: node tools/verificar_escpos_graphics_v747_offline.js
      - name: Native Epson font A/B, emphasis, strike and CP850 V7.50 (offline, Linux)
        run: node tools/verificar_fontes_nativas_v750_offline.js
      - name: Source-verified V6.8 three-way native Epson font shadow adapter V7.52 (Linux)
        run: node tools/verificar_integracao_nativa_tres_vias_v752.js
      - name: Crash, concurrent replay and no-retry policy V7.54 (offline Linux)
        run: node tools/verificar_idempotencia_recuperacao_v754.js
      - name: Five-process synthetic journal crash and tamper V7.55 (Linux)
        run: node tools/verificar_journal_sandbox_v755.js
      - name: Three-way post-crash reconciliation cannot authorize print V7.56 (Linux)
        run: node tools/verificar_reconciliation_v756_offline.js
      - name: Independently trusted Ed25519 synthetic journal seal V7.57 (Linux)
        run: node tools/verificar_signed_anchor_v757_offline.js
      - name: Separate signed witness chain, rollback and untrusted context V7.58 (Linux)
        run: node tools/verificar_external_witness_v758_offline.js
      - name: Native-font V7.51 human approval and one-shot safety (static Linux)
        run: node tools/verificar_piloto_fontes_v751_static.js
      - name: RAW V7.48 approval and one-shot transport policy (static only)
        run: node tools/verificar_raw_pilot_v748_static.js
      - name: ESC/POS adversarial contract RED until issue 22 is fixed
        # Mandatory hard gate: do not mark continue-on-error or swallow exit code.
        run: node tools/verificar_integridade_termica_v57.js
      - name: Full ESC/POS size matrix and command-order audit V5.11
        # Independent RED proof even when the original mandatory V5.7 gate fails.
        # Both remain hard failures; no continue-on-error, printer or spooler.
        if: ${{ !cancelled() }}
        run: node tools/verificar_matriz_escpos_v511.js


  windows-thermal-preview:
    name: Windows offline Figma and ESC/POS integrity (no service)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable PR snapshot
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependencies, no lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Compile source contracts and prepare dist for Node tests
        run: npm run build
      - name: Verify archived Figma SVG masters and thermal traces on Windows
        run: node tools/verificar_desenho_comandas_v72.js
      - name: Bind live four-field watcher identity (Windows CI)
        run: node tools/verificar_identidade_pedido_v727.js
      - name: Passive event audit contract (Windows synthetic fixture, no remote)
        run: node tools/verificar_auditoria_eventos_v730.js
      - name: Windows sidecar shift-and-V2 pin preflight V7.31 (synthetic only)
        run: node tools/verificar_sidecar_preflight_windows_v731.js
      - name: Adversarial 21-case iFood/Teknisa operational lunch simulation
        run: node tools/verificar_riscos_almoco_v735_offline.js
      - name: Windows Sandbox closed-loop config and host isolation V7.33 (static)
        run: node tools/verificar_sandbox_comandas_v733.js
      - name: Parse Windows Sandbox configuration and guest PowerShell syntax
        shell: pwsh
        run: |
          [xml]$cfg = Get-Content -Raw -LiteralPath "runtime/windows/comandas_sandbox_observer_v733.wsb"
          if ($cfg.Configuration.MappedFolders.MappedFolder.Count -ne 4) { throw 'SANDBOX_XML_MOUNT_COUNT_INVALID' }
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            "runtime/windows/comandas_sandbox_observe_v733.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw 'SANDBOX_POWERSHELL_SYNTAX_INVALID' }
      - name: Reconcile V2 consumer, V6.8, pinned Academy motor and three SVG receipts
        run: node tools/verificar_cadeia_positiva_v722_offline.js
      - name: Payment-note V8.0 and B5 preservation (offline, Windows)
        run: node tools/verificar_nota_pagamento_v80_offline.js
      - name: Static exact bag policy B1 B5 B8 B9 in ephemeral V2 motor (Windows)
        run: node tools/verificar_sacolas_estaticas_v81_offline.js
      - name: V8.2 native reader envelope is NOT independent V6.8 source proof (Windows)
        run: node tools/verificar_comandas_v68_envelope_boundary_v82.cjs
      - name: Reject malformed quantities on Windows
        run: node tools/verificar_quantidades_termicas_v59.js
      - name: Modern Epson GS L fn112/fn50 byte golden V7.47 (offline, Windows)
        run: node tools/verificar_escpos_graphics_v747_offline.js
      - name: Native Epson font A/B, emphasis, strike and CP850 V7.50 (offline, Windows)
        run: node tools/verificar_fontes_nativas_v750_offline.js
      - name: Source-verified V6.8 three-way native Epson font shadow adapter V7.52 (Windows)
        run: node tools/verificar_integracao_nativa_tres_vias_v752.js
      - name: Crash, concurrent replay and no-retry policy V7.54 (offline Windows)
        run: node tools/verificar_idempotencia_recuperacao_v754.js
      - name: Five-process synthetic journal crash and tamper V7.55 (Windows)
        run: node tools/verificar_journal_sandbox_v755.js
      - name: Three-way post-crash reconciliation cannot authorize print V7.56 (Windows)
        run: node tools/verificar_reconciliation_v756_offline.js
      - name: Independently trusted Ed25519 synthetic journal seal V7.57 (Windows)
        run: node tools/verificar_signed_anchor_v757_offline.js
      - name: Separate signed witness chain, rollback and untrusted context V7.58 (Windows)
        run: node tools/verificar_external_witness_v758_offline.js
      - name: Native-font V7.51 human approval and one-shot safety (static Windows)
        run: node tools/verificar_piloto_fontes_v751_static.js
      - name: Parse V7.51 physical-pilot script without running printer I/O
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "tools/comandas_native_font_v751_pilot_once_hold.ps1",
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw "V751_POWERSHELL_SYNTAX_INVALID" }
          Write-Output "V751_PARSE_PASS=1 NO_PRINT NO_SPOOLER_EFFECT"

      - name: RAW V7.48 approval and one-shot transport policy (static only)
        run: node tools/verificar_raw_pilot_v748_static.js
      - name: Parse V7.47 offline PowerShell encoder without execution
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "tools/comandas_escpos_graphics_fn112_v747_offline.ps1",
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw "V747_POWERSHELL_SYNTAX_INVALID" }
          Write-Output "V747_SYNTAX_PASS=1 NO_PRINT NO_WINDOWS_DEVICE"
      - name: Parse V7.48 RAW pilot without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "tools/comandas_raw_fn112_v748_pilot_once_hold.ps1",
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw "V748_POWERSHELL_SYNTAX_INVALID" }
          Write-Output "V748_SYNTAX_PASS=1 NO_PRINT NO_SPOOLER_WRITE"
      - name: Verify Epson ESC/POS bytes on Windows
        run: node tools/verificar_integridade_termica_v57.js
