name: q026-two-node-workers-local-pg-shadow
# Research only: two separate Node processes, common disposable PostgreSQL16.
on:
  push:
    branches:
      - research/q026-multiprocess-http-admission-shadow-20261010
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q026-two-worker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  two-process-real-http:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict compile of two-node-process fixture and product code
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --strict --esModuleInterop --skipLibCheck --types node tests/product/run-q026-multiprocess-http-admission-shadow.ts tests/product/q026-multiprocess-server-child.ts
      - name: Actual HTTP across 2 Node workers and 1 PostgreSQL16
        shell: bash
        run: |
          set -o pipefail
          npx tsx tests/product/run-q026-multiprocess-http-admission-shadow.ts | tee q026-two-process.log
          grep '^Q026_MULTIPROCESS_ADMISSION_SHADOW_PASS ' q026-two-process.log
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:platform:q016
      - run: npm run test:platform:product
      - run: npm run test:platform:governanca
      - name: No PG must be an explicit non-success
        shell: bash
        run: |
          set +e
          DELIVERYOS_PG_URL= npx tsx tests/product/run-q026-multiprocess-http-admission-shadow.ts
          test "$?" = 78
