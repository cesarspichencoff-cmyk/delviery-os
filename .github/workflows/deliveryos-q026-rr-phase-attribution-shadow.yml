name: deliveryos-q026-rr-phase-attribution-shadow
# SHADOW-only phase metrics, PostgreSQL16 ephemeral.
on:
  push:
    branches:
      - research/q026-rr-phase-attribution-shadow-20261010
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q026-phase-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase-measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        events: [120000, 300000]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
      Q026_PHASE_PROBE_EVENTS: ${{ matrix.events }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck transaction phase probe
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --target ES2022 --module commonjs --moduleResolution node --strict --esModuleInterop --skipLibCheck --types node tests/product/run-q026-rr-phase-attribution-shadow.ts
      - name: Measure actual RR reader and post transaction mapping
        shell: bash
        run: |
          set -o pipefail
          npx tsx tests/product/run-q026-rr-phase-attribution-shadow.ts | tee q026-phases.out
          grep '^Q026_RR_PHASE_ATTRIBUTION_SHADOW_MEASURED ' q026-phases.out
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:platform:q016
      - run: npm run test:platform:product
      - run: npm run test:platform:governanca
      - name: Fail closed without real PG
        shell: bash
        run: |
          set +e
          DELIVERYOS_PG_URL= npx tsx tests/product/run-q026-rr-phase-attribution-shadow.ts
          test "$?" = 78
