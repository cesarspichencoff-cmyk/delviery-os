name: DeliveryOS X1 trip ownership (trip capture grant)

# X1: um motoboy autenticado gravava posição na viagem de outro. Correção: o
# piloto, dono da viagem, emite uma concessão presa a unidade, motoboy, aparelho
# e janela da viagem; a plataforma só grava GPS com ela. Tudo sintético:
# aparelhos, motoboys e viagens fabricados, PostgreSQL descartável do runner.
#
# NÃO prova: aparelho físico, rede móvel, o caixa, o proxy real.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - integration/deliveryos-v1-connected-20261102
    paths:
      - .github/workflows/deliveryos-x1-trip-grant.yml
      - src/entregas/foundation/trip-capture-grant.ts
      - src/platform/ingest/device-ingest.ts
      - src/platform/runtime/rota-ingestao.ts
      - src/platform/bin/critical.ts
      - src/platform/aparelho-logico.ts
      - src/platform/concessao-de-teste.ts
      - src/platform/run-concessao-de-viagem-tests.ts
      - src/platform/run-cadeia-*.ts
      - src/platform/run-home-entregas-tests.ts
      - src/product/viewmodels/entregas-vm.ts
      - src/product/ui/surfaces/home.js
      - tools/product_system_server.ts
      - src/entregas/pilot/access-throttle.ts
      - src/entregas/pilot/run-access-throttle-tests.ts
      - src/platform/database-preflight.ts
      - src/platform/run-database-preflight-tests.ts
      - src/entregas/consent/**
      - docs/entregas/pilot/termo-localizacao-minuta.json
      - src/platform/run-relogio-tests.ts
      - src/platform/run-q017-source-mode-tests.ts
      - src/entregas/pilot/**
      - tools/entregas_pilot_server.ts
      - tests/x1/**
      - src/platform/campo/**
      - src/platform/bin/portao-de-campo.ts
      - src/platform/run-portao-de-campo-tests.ts
      - tests/campo/**
      - deploy/compose.platform.yaml
      - tools/pb19_ingestao_real.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deliveryos-x1-trip-grant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DELIVERYOS_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Compilar plataforma, migracoes e contratos (binarios de dist/)
        run: npm run -s build:platform
      - name: Concessao de viagem — ataques a rota de ingestao (23)
        run: npx tsx src/platform/run-concessao-de-viagem-tests.ts
      - name: Piloto real — concede so a viagem do proprio motoboy (capture-state)
        run: npx tsx src/entregas/pilot/run-capture-control-http-tests.ts
      - name: Piloto real — rota de concessoes pela credencial delegada (pt1)
        run: npx tsx src/entregas/pilot/run-trip-grants-delegated-http-tests.ts
      - name: Dois motoboys, dois aparelhos, PostgreSQL real — X1 fechada
        run: npx tsx src/platform/run-cadeia-multiaparelho-tests.ts
      - name: Tres e cinco motoboys ao mesmo tempo, PostgreSQL real (logicos, nao fisicos)
        run: npx tsx src/platform/run-cadeia-n-motoboys-tests.ts
      - name: Entregas na Home do gerente (servidor da Home de dist/, tres motoboys, sem banco e banco fora)
        run: npx tsx src/platform/run-home-entregas-tests.ts
      - name: Login atras de origem compartilhada, preflight sem drift da sonda, minuta do termo nao publicavel
        run: |
          npx tsx src/entregas/pilot/run-access-throttle-tests.ts
          npx tsx src/platform/run-database-preflight-tests.ts
          npx tsx src/entregas/consent/run-termo-minuta-tests.ts
      - name: Cadeias existentes que enviam GPS seguem verdes
        run: |
          npx tsx src/platform/run-cadeia-real-tests.ts
          npx tsx src/platform/run-relogio-tests.ts
          npx tsx src/platform/run-q017-source-mode-tests.ts
          npx tsx src/entregas/pilot/run-canonical-dispatch-postgres-tests.ts
          npx tsx src/platform/run-bridge-tests.ts
          npx tsx src/platform/run-event-contract-tests.ts
          npx tsx src/platform/run-runtime-wiring-tests.ts
      - name: Mutacoes da concessao (zero cegas)
        run: node tests/x1/run-trip-grant-mutation-tests.cjs
      - name: Mutacoes multiaparelho que reabrem a X1
        run: npx tsx src/platform/run-cadeia-multiaparelho-mutation-tests.ts
        env:
          MULTI_MUT: MA8,MA9

  # D101: a única porta que os celulares alcançam. Lista fechada de rotas, só motoboy no campo.
  portao-de-campo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Compilar plataforma (binários de dist/)
        run: npm run -s build:platform
      - name: Portão de campo com o piloto real (superfície, papel, teto de corpo)
        run: npx tsx src/platform/run-portao-de-campo-tests.ts
      - name: Mutações do portão e da restrição de papel (zero cegas)
        run: node tests/campo/run-portao-de-campo-mutation-tests.cjs
