<!doctype html>
<!--
  DeliveryOS · Copiloto V3.3 — superfície do organismo.
  Motor real (motor.js + decisao.js). Interface nunca decide.
  Design canônico: design-reference/copiloto-v33/ (imutável).
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08130D">
  <title>DeliveryOS · Copiloto V3.3</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="calmo">
  <header class="topo" id="topo">
    <div class="topo-left">
      <div class="marca">
        <span class="marca-eye">DeliveryOS</span>
        <span class="marca-title">Operação viva</span>
      </div>
      <div class="fonte-dado" id="fonteDado">carregando…</div>
    </div>
    <div class="topo-right">
      <div id="techBadge" class="tech-badge" hidden>
        <span class="tech-pip" aria-hidden="true"></span>
        <span class="tech-label" id="techLabel"></span>
      </div>
      <button type="button" id="btMic" class="btn-mic" aria-label="Voz (demonstração)" title="Voz · demonstração">
        <span class="mic-icon" aria-hidden="true"></span>
        <span class="mic-tag">demo</span>
      </button>
      <button type="button" id="btCloseShift" class="btn-ghost-top" hidden>Fechar turno</button>
    </div>
  </header>

  <main id="palco" class="palco" aria-live="polite">
    <section class="estado carregando" id="telaCarregando">
      <p class="sussurro">Preparando a operação…</p>
    </section>
  </main>

  <!-- Painel de voz (inline, não chatbot, não modal permanente) -->
  <aside id="voicePanel" class="voice-panel" hidden aria-label="Voz demonstração"></aside>

  <!-- Fechamento de turno (inline) -->
  <aside id="closingPanel" class="closing-panel" hidden aria-label="Fechamento de turno"></aside>

  <!-- Catálogo QA — só com ?qa=1 — NÃO é produto -->
  <aside id="qaCatalog" class="qa-catalog" hidden aria-label="V3.3 QA Catalog">
    <div class="qa-head">
      <span class="qa-title">V3.3 QA Catalog</span>
      <span class="qa-note">dev / QA · não é navegação do produto</span>
      <button type="button" id="qaClose" class="btn-ghost-top">Fechar</button>
    </div>
    <div id="qaList" class="qa-list"></div>
  </aside>

  <footer class="replay" id="replay" hidden>
    <div class="replay-rotulo">Replay de janela para demonstração. Não é operação ao vivo.</div>
    <div class="replay-controles">
      <button id="btPlay" class="bt" aria-label="tocar ou pausar">▶</button>
      <input id="linha" class="linha" type="range" min="0" max="0" value="0" step="1" aria-label="posição no tempo">
      <span id="relogio" class="relogio"></span>
      <button id="btVel" class="bt bt-vel" aria-label="velocidade do replay">10×</button>
      <button id="btSom" class="bt bt-som" aria-label="som do foco">Som desligado</button>
      <button id="btQa" class="bt bt-qa" type="button" hidden>QA</button>
    </div>
  </footer>

  <script src="../src/perfil-delivery/motor.js"></script>
  <script src="../src/perfil-delivery/decisao.js"></script>
  <script src="../src/live/interface/adaptador-v33.js"></script>
  <script src="v33-mocks.js"></script>
  <script src="app.js"></script>
</body>
</html>
