<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ENTREGAS · Expedição iFood</title>
  <link rel="stylesheet" href="/shared/tokens.css" />
  <link rel="stylesheet" href="/ifood-handoff/handoff.css" />
</head>
<body>
  <div class="demo-banner" role="status">AMBIENTE DE DEMONSTRAÇÃO · EXPEDIÇÃO IFOOD</div>
  <header class="shell-header">
    <div class="shell-brand">ENTREGAS <span>expedição iFood</span></div>
    <div class="shell-tools">
      <label class="sound-toggle" title="Som discreto ao ficar pronto">
        <input type="checkbox" id="soundEnabled" checked />
        <span>Som</span>
      </label>
      <a class="muted" href="/console/">← Console</a>
    </div>
  </header>

  <main class="exp-wrap" id="app">
    <!-- Preenchido por handoff.js: home | detail stages -->
  </main>

  <div id="errorBox" class="error-box" hidden role="alert"></div>

  <!-- Controles de demo: só montados se /api/health.demo_controls === true -->
  <aside id="demoDock" class="demo-dock" hidden aria-label="Controles de demonstração">
    <p class="label-meta">Demo</p>
    <button type="button" id="btnDemoReady">Simular novo pedido pronto</button>
    <button type="button" id="btnDemoEmpty">Estado sem prontos</button>
    <button type="button" id="btnDemoReset">Reiniciar fila</button>
  </aside>

  <script type="module" src="/ifood-handoff/handoff.js"></script>
</body>
</html>
