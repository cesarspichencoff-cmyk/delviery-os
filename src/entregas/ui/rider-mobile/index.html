<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ENTREGAS · Motoboy</title>
  <link rel="stylesheet" href="/shared/tokens.css" />
  <link rel="stylesheet" href="/rider-mobile/rider.css" />
</head>
<body class="mobile">
  <div class="demo-banner" role="status">AMBIENTE DE DEMONSTRAÇÃO · app motoboy interno</div>
  <header class="m-header">
    <div class="shell-brand">ENTREGAS</div>
    <p id="connLine" class="muted conn" role="status">Conexão…</p>
  </header>
  <main id="main" class="m-main">
    <div id="syncBar" class="sync-bar" hidden>
      <span class="dot dashed" aria-hidden="true"></span>
      <div>
        <div class="sync-title" id="syncTitle">Sem rede no momento</div>
        <div class="muted small" id="syncDetail">Suas confirmações ficam guardadas e sobem sozinhas quando a rede voltar.</div>
      </div>
    </div>

    <div id="stageRail" class="stage-rail" aria-label="Etapa da parada"></div>

    <section class="m-focus" aria-labelledby="stopTitle">
      <p class="label-meta" id="stopMeta">Parada</p>
      <h1 class="title-sov" id="stopTitle">Carregando…</h1>
      <p class="sub-human" id="stopSub"></p>
      <div id="stopCard" class="card stop-card" hidden></div>
      <p class="muted small" id="nextLine"></p>
      <p class="gps-status" id="gpsStatus" role="status" data-running="false" data-freshness="unknown">GPS DESLIGADO — SEM VIAGEM ATIVA</p>
      <p class="muted small loc" id="locLine">O GPS depende deste aplicativo aberto durante a viagem.</p>
    </section>

    <section class="actions-stack" aria-label="Ação principal">
      <!-- Um botão soberano por estado; outros só quando válidos -->
      <button type="button" class="primary big btn-sovereign" id="btnPrimary" hidden>Ação</button>
      <button type="button" class="big" id="btnSecondary" hidden>Secundária</button>
      <div id="problemRow" class="problem-row" hidden>
        <button type="button" class="ghost" id="btnNotFound" hidden>Cliente não encontrado</button>
        <button type="button" class="ghost" id="btnProblem">Registrar problema</button>
      </div>
      <button type="button" class="secondary-link" id="btnSyncNow" hidden>Enviar agora (se a rede voltou)</button>
    </section>

    <div id="errorBox" class="error-box" hidden role="alert"></div>
    <p class="trip-foot muted" id="tripFoot"></p>
  </main>
  <nav class="m-nav" aria-label="Navegação demo">
    <a href="/console/">Console</a>
    <a href="/ifood-handoff/">Expedição iFood</a>
  </nav>
  <script type="module" src="/rider-mobile/rider.js"></script>
</body>
</html>
