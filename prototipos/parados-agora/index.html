<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#F6F7F3"/>
<title>Parados Agora</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400,300&display=swap" rel="stylesheet">
<style>
  :root{
    --paper1:#FBFCFA; --paper2:#F1F4EE; --ink:#19211C; --soft:#566059; --faint:#949D95;
    --hair:rgba(25,33,28,.06);
    --green:14,122,79; --amber:181,86,40;
    --font:'Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#DFE3DC;min-height:100%;display:grid;place-items:center;padding:22px;
    font-family:var(--font);color:var(--ink);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
    user-select:none;cursor:default}

  .stage{width:384px;max-width:94vw;height:min(824px,90vh);border-radius:38px;overflow:hidden;position:relative;
    background:radial-gradient(130% 92% at 50% 26%, var(--paper1) 0%, var(--paper2) 72%);
    box-shadow:0 22px 60px -28px rgba(20,50,34,.34), inset 0 0 0 1px var(--hair);
    display:flex;flex-direction:column;padding:32px 30px 26px}

  /* topo: só identidade + relógio (sem controles) */
  .top{display:flex;align-items:center;justify-content:space-between;z-index:4}
  .brand{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--soft)}
  .glyph{width:10px;height:10px;border-radius:50%;background:rgba(var(--green),1);animation:beat 4.5s ease-in-out infinite}
  .clock{font-size:11.5px;font-weight:500;letter-spacing:.16em;color:var(--faint);font-variant-numeric:tabular-nums}

  /* o campo vivo */
  .field{flex:1;position:relative}
  .aura{position:absolute;left:50%;top:50%;width:330px;height:330px;border-radius:50%;
    transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(circle, rgba(var(--green),.13) 0%, rgba(var(--green),.045) 38%, transparent 66%);
    animation:beat 6s ease-in-out infinite;transition:opacity .9s ease}
  .bloom{position:absolute;left:50%;top:46%;width:344px;height:344px;border-radius:50%;
    transform:translate(-50%,-50%);pointer-events:none;opacity:0;
    background:radial-gradient(circle, rgba(var(--amber),.16) 0%, rgba(var(--amber),.05) 42%, transparent 68%);
    animation:beat 4.6s ease-in-out infinite;transition:opacity .9s ease}
  @keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1}50%{transform:translate(-50%,-50%) scale(1.05)}}
  .flow{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .flow i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(var(--green),.5);bottom:20%;opacity:0;
    animation:rise 8.5s linear infinite}
  @keyframes rise{0%{opacity:0;transform:translateY(0)}16%{opacity:.55}100%{opacity:0;transform:translateY(-200px) scale(.4)}}

  /* camadas calmo / atenção — cruzam sem toggle */
  .layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 10px;z-index:2}

  .calm{transition:opacity .9s ease, transform .9s ease}
  .ring{width:152px;height:152px;position:relative;margin-bottom:30px}
  .ring svg{transform:rotate(-90deg)}
  .ring .tk{stroke:rgba(var(--green),.16)} .ring .ar{stroke:rgba(var(--green),1);stroke-linecap:round}
  .ring .pip{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;
    background:rgba(var(--green),1);animation:beat 4s ease-in-out infinite}
  .calm-word{font-size:33px;font-weight:300;letter-spacing:-.02em;color:var(--ink)}
  .calm-sub{margin-top:11px;font-size:13px;font-weight:600;letter-spacing:.09em;color:var(--faint)}

  .alert{opacity:0;transform:translateY(18px);transition:opacity .9s ease, transform .9s ease}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.18em;color:rgba(var(--amber),1)}
  .eyebrow .d{width:7px;height:7px;border-radius:50%;background:rgba(var(--amber),1);animation:beat 2.8s ease-in-out infinite}
  .zone{font-size:54px;line-height:1;font-weight:700;letter-spacing:-.04em;margin-top:16px;color:var(--ink)}
  .dur{margin-top:24px;display:flex;align-items:baseline;gap:9px;font-variant-numeric:tabular-nums}
  .dur .n{font-size:60px;line-height:.85;font-weight:300;letter-spacing:-.04em;color:var(--ink)}
  .dur .u{font-size:18px;font-weight:500;color:var(--soft)}
  .why{margin-top:16px;font-size:15px;font-weight:500;color:var(--soft);max-width:26ch;line-height:1.45}
  .why b{color:var(--ink);font-weight:600}
  .cue{margin-top:28px;display:inline-flex;align-items:center;gap:11px;color:rgba(var(--amber),1);
    font-size:17px;font-weight:600;letter-spacing:-.005em}
  .cue .arrow{font-size:18px;animation:nudge 2.2s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0);opacity:.7}50%{transform:translateX(5px);opacity:1}}

  /* eco da 2ª zona — secundário legível, só na atenção */
  .echo{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:2;opacity:0;
    display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;color:var(--soft);
    font-variant-numeric:tabular-nums;transition:opacity .9s ease}
  .echo .d{width:6px;height:6px;border-radius:50%;background:rgba(var(--amber),.7)}
  .echo b{color:var(--ink);font-weight:600}

  /* sinal vital constante (a operação viva, calma ou não) */
  .vital{z-index:4;align-self:center;display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600;
    letter-spacing:.08em;color:var(--faint);font-variant-numeric:tabular-nums}
  .vital .v{width:6px;height:6px;border-radius:50%;background:rgba(var(--green),1);animation:beat 4s ease-in-out infinite}

  /* estado de atenção: calmo recua, foco emerge */
  .stage.alert .aura{opacity:.45}
  .stage.alert .bloom{opacity:1}
  .stage.alert .calm{opacity:0;transform:scale(.96) translateY(-10px)}
  .stage.alert .alert{opacity:1;transform:none}
  .stage.alert .echo{opacity:1}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="top">
      <div class="brand"><span class="glyph"></span>DELIVERYOS</div>
      <div class="clock" id="clock">21:34</div>
    </div>

    <div class="field">
      <div class="aura"></div>
      <div class="bloom"></div>
      <div class="flow">
        <i style="left:44%;animation-delay:0s"></i><i style="left:56%;animation-delay:2.4s"></i>
        <i style="left:49%;animation-delay:4.8s"></i><i style="left:59%;animation-delay:6.6s"></i>
      </div>

      <!-- CALMO -->
      <div class="layer calm">
        <div class="ring">
          <svg width="152" height="152" viewBox="0 0 152 152">
            <circle class="tk" cx="76" cy="76" r="66" fill="none" stroke-width="7"/>
            <circle class="ar" cx="76" cy="76" r="66" fill="none" stroke-width="7" stroke-dasharray="415" stroke-dashoffset="46"/>
          </svg>
          <span class="pip"></span>
        </div>
        <div class="calm-word">em fluxo</div>
        <div class="calm-sub">NADA PARADO AGORA</div>
      </div>

      <!-- ATENÇÃO (emerge da calma) -->
      <div class="layer alert">
        <span class="eyebrow"><span class="d"></span>PRECISA DE ATENÇÃO</span>
        <div class="zone">Expedição</div>
        <div class="dur"><span class="n" id="dmin">53</span><span class="u">min parado</span></div>
        <div class="why"><b>Pronto</b>, aguardando motoboy · pedido 8606</div>
        <div class="cue"><span class="arrow">→</span>conferir a saída</div>
      </div>

      <div class="echo"><span class="d"></span>produção · mais <b>1</b> · 24 min</div>
    </div>

    <div class="vital"><span class="v"></span>18 EM FLUXO · RITMO NORMAL</div>
  </div>

<script>
  const stage=document.getElementById('stage');
  const ck=document.getElementById('clock');
  const dmin=document.getElementById('dmin');

  // relógio vivo
  (function t(){const d=new Date();ck.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');setTimeout(t,15000);})();

  // sempre ligada: evita a tela dormir (best-effort, sem UI)
  let wl=null;
  async function lock(){try{if('wakeLock' in navigator){wl=await navigator.wakeLock.request('screen');}}catch(e){}}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')lock();});
  lock();

  // a tela vive na calma e o foco emerge sozinho (sem controle visível).
  // tempos longos para dar tempo de ler com calma cada estado.
  let auto=true, alerted=false, timer=null, m=53;
  function show(on){
    alerted=on;
    if(on){ m=53; dmin.textContent=m; }
    stage.classList.toggle('alert', on);
  }
  function loop(){
    if(!auto) return;
    show(!alerted);
    timer=setTimeout(loop, alerted ? 18000 : 12000);
  }
  setInterval(()=>{ if(alerted){ m++; dmin.textContent=m; } }, 5000); // o tempo parado corre
  setTimeout(loop, 6000); // começa serena; o foco emerge depois

  // REVISÃO (invisível, não é botão): toque em qualquer lugar para segurar e alternar os
  // estados o tempo que quiser. O produto real se conduzirá por eventos, não por toque.
  stage.addEventListener('click', ()=>{ auto=false; clearTimeout(timer); show(!alerted); });
</script>
</body>
</html>
