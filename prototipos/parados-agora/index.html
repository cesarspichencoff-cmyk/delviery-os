<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#F6F7F3"/>
<title>Parados Agora — DeliveryOS</title>
<!-- @dsCard group="Telas" name="Parados Agora · Campo Vivo" subtitle="Claro (principal) / Escuro · Atenção / Calmo" -->
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400,300&display=swap" rel="stylesheet">
<style>
  /* ---------- CLARO (principal) ---------- */
  :root{
    --paper1:#FBFCFA; --paper2:#F2F4EF; --ink:#19211C; --soft:#586159; --faint:#929B92;
    --hair:rgba(25,33,28,.07);
    --green:14,122,79; --amber:181,86,40;
    --aura-life:radial-gradient(circle, rgba(var(--green),.13) 0%, rgba(var(--green),.045) 38%, transparent 66%);
    --aura-attn:radial-gradient(circle, rgba(var(--amber),.16) 0%, rgba(var(--amber),.05) 42%, transparent 68%);
    --seedglow:0 0 0 0 rgba(var(--green),0); --titleglow:none;
    --panel:rgba(255,255,255,.66); --seg-bg:rgba(25,33,28,.04); --seg-line:rgba(25,33,28,.08);
    --shadow:0 22px 60px -28px rgba(20,50,34,.34);
    --font:'Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
  }
  /* ---------- ESCURO (modo noturno) ---------- */
  .theme-dark{
    --paper1:#101815; --paper2:#0A100E; --ink:#EEF4F0; --soft:rgba(238,244,240,.68); --faint:rgba(238,244,240,.40);
    --hair:rgba(255,255,255,.07);
    --green:74,224,165; --amber:240,158,116;
    --aura-life:radial-gradient(circle, rgba(var(--green),.42) 0%, rgba(var(--green),.12) 36%, transparent 66%);
    --aura-attn:radial-gradient(circle, rgba(var(--amber),.30) 0%, rgba(var(--amber),.10) 40%, transparent 68%);
    --seedglow:0 0 22px 3px rgba(var(--green),.6); --titleglow:0 0 36px rgba(var(--amber),.30);
    --panel:rgba(255,255,255,.05); --seg-bg:rgba(255,255,255,.05); --seg-line:rgba(255,255,255,.08);
    --shadow:0 30px 80px -34px rgba(0,40,28,.7);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#DDE2DB;min-height:100%;display:grid;place-items:center;padding:22px;
    font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}

  .stage{width:384px;max-width:94vw;height:min(824px,90vh);border-radius:38px;overflow:hidden;position:relative;color:var(--ink);
    background:radial-gradient(130% 92% at 50% 26%, var(--paper1) 0%, var(--paper2) 72%);
    box-shadow:var(--shadow), inset 0 0 0 1px var(--hair);
    display:flex;flex-direction:column;padding:30px 30px 24px;transition:background .5s ease,color .5s ease}

  /* topo */
  .top{display:flex;align-items:center;justify-content:space-between;z-index:3}
  .mark{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--soft)}
  .glyph{width:11px;height:11px;border-radius:50%;background:rgba(var(--green),1);box-shadow:var(--seedglow);animation:beat 4.5s ease-in-out infinite}
  .time{display:flex;align-items:center;gap:14px}
  .clock{font-size:11.5px;font-weight:500;letter-spacing:.16em;color:var(--faint);font-variant-numeric:tabular-nums}
  .theme{width:26px;height:26px;border-radius:50%;border:1px solid var(--seg-line);background:var(--seg-bg);cursor:pointer;display:grid;place-items:center;color:var(--soft);font-size:13px}

  .field{flex:1;position:relative;display:flex;flex-direction:column;align-items:center}

  /* aura viva (a operação respirando) */
  .aura{position:absolute;left:50%;width:320px;height:320px;border-radius:50%;transform:translateX(-50%);pointer-events:none;background:var(--aura-life);animation:beat 6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:translateX(-50%) scale(1);opacity:.92}50%{transform:translateX(-50%) scale(1.05);opacity:1}}
  .seed{position:absolute;left:50%;width:9px;height:9px;border-radius:50%;transform:translateX(-50%);background:rgba(var(--green),1);box-shadow:var(--seedglow)}
  .flow{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .flow i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(var(--green),.55);bottom:16%;opacity:0;animation:rise 8s linear infinite}
  @keyframes rise{0%{opacity:0;transform:translateY(0)}14%{opacity:.6}100%{opacity:0;transform:translateY(-210px) scale(.4)}}

  /* ---------- ATENÇÃO ---------- */
  .att{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;animation:emerge .7s cubic-bezier(.2,.7,.2,1) both}
  @keyframes emerge{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .bloom{position:absolute;top:-14px;left:50%;width:340px;height:340px;transform:translateX(-50%);pointer-events:none;background:var(--aura-attn);animation:beat 4.6s ease-in-out infinite}
  .readout{position:relative;z-index:2;padding-top:70px;display:flex;flex-direction:column;align-items:center}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.18em;color:rgba(var(--amber),1)}
  .eyebrow .d{width:7px;height:7px;border-radius:50%;background:rgba(var(--amber),1);animation:beat 2.8s ease-in-out infinite}
  .zone{font-size:54px;line-height:1;font-weight:700;letter-spacing:-.04em;margin-top:16px;color:var(--ink);text-shadow:var(--titleglow)}
  .dur{margin-top:24px;display:flex;align-items:baseline;gap:9px;font-variant-numeric:tabular-nums}
  .dur .n{font-size:60px;line-height:.85;font-weight:300;letter-spacing:-.04em;color:var(--ink)}
  .dur .u{font-size:19px;font-weight:500;color:var(--soft)}
  .why{margin-top:16px;font-size:15px;font-weight:500;color:var(--soft);max-width:24ch;line-height:1.45}
  .why b{color:var(--ink);font-weight:600}
  /* comando visual (NÃO é botão) */
  .cue{margin-top:30px;display:inline-flex;align-items:center;gap:11px;color:rgba(var(--amber),1);font-size:17px;font-weight:600;letter-spacing:-.005em}
  .cue .arrow{font-size:18px;animation:nudge 2.2s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0);opacity:.7}50%{transform:translateX(5px);opacity:1}}

  /* eco da 2ª zona (secundário legível) */
  .echo{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;z-index:2;
    font-size:13.5px;font-weight:500;color:var(--soft);font-variant-numeric:tabular-nums}
  .echo .d{width:6px;height:6px;border-radius:50%;background:rgba(var(--amber),.7)}
  .echo b{color:var(--ink);font-weight:600}

  /* ---------- CALMO ---------- */
  .calm{position:relative;z-index:2;flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:emerge .7s cubic-bezier(.2,.7,.2,1) both}
  .ring{width:158px;height:158px;position:relative;margin-bottom:30px}
  .ring svg{transform:rotate(-90deg)}
  .ring .tk{stroke:rgba(var(--green),.16)} .ring .ar{stroke:rgba(var(--green),1);stroke-linecap:round;animation:draw 1.5s cubic-bezier(.3,.8,.3,1) both}
  @keyframes draw{from{stroke-dashoffset:430}to{stroke-dashoffset:48}}
  .ring .pip{position:absolute;inset:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:rgba(var(--green),1);box-shadow:var(--seedglow);animation:beat 4s ease-in-out infinite}
  .calm-word{font-size:34px;font-weight:300;letter-spacing:-.02em;color:var(--ink)}
  .calm-sub{margin-top:12px;font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--faint)}
  .state-calm .att,.state-calm .echo{display:none}
  .state-calm .calm{display:flex}

  /* base */
  .foot{z-index:3;display:flex;flex-direction:column;align-items:center;gap:15px}
  .vital{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--faint);font-variant-numeric:tabular-nums}
  .vital .v{width:6px;height:6px;border-radius:50%;background:rgba(var(--green),1);box-shadow:var(--seedglow);animation:beat 4s ease-in-out infinite}
  .seg{display:inline-flex;gap:3px;background:var(--seg-bg);border:1px solid var(--seg-line);border-radius:999px;padding:4px}
  .seg button{border:none;background:none;cursor:pointer;font-family:var(--font);padding:8px 20px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--soft);transition:.25s}
  .seg button.on{background:rgba(var(--green),.14);color:var(--ink)}
  .cap{font-size:9.5px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="top">
      <div class="mark"><span class="glyph"></span>DELIVERYOS</div>
      <div class="time">
        <span class="clock" id="clock">21:34</span>
        <button class="theme" id="theme" title="claro / escuro">☾</button>
      </div>
    </div>

    <div class="field">
      <div class="aura" style="top:96px"></div>
      <div class="seed" style="top:238px"></div>
      <div class="flow">
        <i style="left:43%;animation-delay:0s"></i><i style="left:56%;animation-delay:2s"></i>
        <i style="left:49%;animation-delay:4s"></i><i style="left:60%;animation-delay:6s"></i>
      </div>

      <!-- ATENÇÃO -->
      <div class="att">
        <div class="bloom"></div>
        <div class="readout">
          <span class="eyebrow"><span class="d"></span>PRECISA DE ATENÇÃO</span>
          <div class="zone">Expedição</div>
          <div class="dur"><span class="n">53</span><span class="u">min parado</span></div>
          <div class="why"><b>Pronto</b>, aguardando motoboy · pedido 8606</div>
          <div class="cue"><span class="arrow">→</span>conferir a saída</div>
        </div>
      </div>
      <div class="echo"><span class="d"></span>produção · mais <b>1</b> · 24 min</div>

      <!-- CALMO -->
      <div class="calm">
        <div class="ring">
          <svg width="158" height="158" viewBox="0 0 158 158">
            <circle class="tk" cx="79" cy="79" r="68" fill="none" stroke-width="7"/>
            <circle class="ar" cx="79" cy="79" r="68" fill="none" stroke-width="7" stroke-dasharray="427" stroke-dashoffset="48"/>
          </svg>
          <span class="pip"></span>
        </div>
        <div class="calm-word">em fluxo</div>
        <div class="calm-sub">NADA PARADO AGORA</div>
      </div>
    </div>

    <div class="foot">
      <div class="vital"><span class="v"></span>18 EM FLUXO · RITMO NORMAL</div>
      <div class="seg">
        <button class="on" data-s="att">Atenção</button>
        <button data-s="calm">Calmo</button>
      </div>
      <div class="cap">pré-visualização de estados</div>
    </div>
  </div>

<script>
  const stage=document.getElementById('stage');
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');stage.classList.toggle('state-calm', b.dataset.s==='calm');
  }));
  const tb=document.getElementById('theme');
  tb.addEventListener('click',()=>{const d=stage.classList.toggle('theme-dark');tb.textContent=d?'☀':'☾';});
  const ck=document.getElementById('clock');
  (function t(){const d=new Date();ck.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');setTimeout(t,15000);})();
</script>
</body>
</html>
