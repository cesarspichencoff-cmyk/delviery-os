<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08130D" />
  <title>Entregas · V0.3 — identidade V3.3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-surface="desktop" data-mode="calmo">
  <!-- Demo fora do produto (não é navegação real) -->
  <div class="demo-bar" aria-label="Demonstração">
    <label for="scenario-select">Demo</label>
    <select id="scenario-select"></select>
    <span class="demo-sep" aria-hidden="true">·</span>
    <div class="view-seg" role="group" aria-label="Superfície">
      <button type="button" id="btn-desktop" aria-pressed="true">Organismo</button>
      <button type="button" id="btn-mobile" aria-pressed="false">Próximo passo</button>
    </div>
  </div>

  <main id="palco" class="palco">
    <!-- Desktop: organismo de viagens (mesma superfície) -->
    <section id="campo" class="campo is-active" aria-label="Organismo de entregas">
      <header class="campo-topo">
        <div class="marca-block">
          <span class="marca-eye">DeliveryOS · Entregas</span>
          <div class="marca">Operação de viagens</div>
        </div>
        <div id="campo-sussurro" class="sussurro"></div>
      </header>
      <div id="organismo" class="organismo" role="list"></div>
    </section>

    <!-- Mobile: próximo passo -->
    <section id="mobile-wrap" class="mobile-wrap" aria-label="Próximo passo">
      <div class="phone">
        <div class="phone-inner">
          <div class="phone-meta">
            <span class="phone-marca">Entregas</span>
            <span id="phone-conn" class="conn tech-state"><span class="pip" aria-hidden="true"></span><span class="conn-text">Conectado</span></span>
          </div>
          <div id="phone-body" class="phone-body"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h3 id="modal-title">—</h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="modal-cancel">Cancelar</button>
        <button type="button" class="btn-pill" id="modal-primary">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
