<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F3ED" />
  <title>Entregas · V0.2</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-surface="desktop">
  <!-- Demo fora do produto (como replay do DeliveryOS V1) -->
  <div class="demo-bar" aria-label="Demonstração">
    <label for="scenario-select">Demo</label>
    <select id="scenario-select"></select>
    <span class="demo-sep" aria-hidden="true">·</span>
    <div class="view-seg" role="group" aria-label="Superfície">
      <button type="button" id="btn-desktop" aria-pressed="true">Campo</button>
      <button type="button" id="btn-mobile" aria-pressed="false">Próximo passo</button>
    </div>
  </div>

  <main id="palco" class="palco">
    <!-- Desktop: campo de trajetórias -->
    <section id="campo" class="campo is-active" aria-label="Campo de viagens">
      <header class="campo-topo">
        <div class="marca">Entregas</div>
        <div id="campo-sussurro" class="sussurro"></div>
      </header>
      <div id="trajetorias" class="trajetorias" role="list"></div>
    </section>

    <!-- Mobile: próximo passo -->
    <section id="mobile-wrap" class="mobile-wrap" aria-label="Próximo passo">
      <div class="phone">
        <div class="phone-inner">
          <div class="phone-meta">
            <span class="phone-marca">Entregas</span>
            <span id="phone-conn" class="conn"><span class="pip" aria-hidden="true"></span>Conectado</span>
          </div>
          <div id="phone-body" class="phone-body"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h3 id="modal-title">—</h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="modal-cancel">Cancelar</button>
        <button type="button" class="btn-pill" id="modal-primary">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
